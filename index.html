<style>
:root{
  --bg:#F0EBE1; --surface:#FAF7F1; --surface-2:#E7E0D3; --line:#D6CCB9;
  --text:#191C21; --dim:#6B6255; --faint:#9A9184;
  --brass:#9E6F16; --brass-lit:#C08D26; --brass-dim:#C9B78A;
  --vinyl:#17181B; --vinyl-2:#303239; --groove:rgba(255,255,255,.07);
  --deck:#E4DCCC; --shadow:0 1px 2px rgba(30,22,8,.10), 0 8px 28px rgba(30,22,8,.10);
  --sleeve-shadow:0 10px 30px rgba(30,22,8,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E12; --surface:#14171D; --surface-2:#1B1F27; --line:#292E38;
    --text:#ECE6DA; --dim:#98A0AC; --faint:#6C737E;
    --brass:#D6A340; --brass-lit:#EFC46A; --brass-dim:#7A6132;
    --vinyl:#08090B; --vinyl-2:#1D1F25; --groove:rgba(255,255,255,.055);
    --deck:#101319; --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 34px rgba(0,0,0,.55);
    --sleeve-shadow:0 14px 34px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E12; --surface:#14171D; --surface-2:#1B1F27; --line:#292E38;
  --text:#ECE6DA; --dim:#98A0AC; --faint:#6C737E;
  --brass:#D6A340; --brass-lit:#EFC46A; --brass-dim:#7A6132;
  --vinyl:#08090B; --vinyl-2:#1D1F25; --groove:rgba(255,255,255,.055);
  --deck:#101319; --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 34px rgba(0,0,0,.55);
  --sleeve-shadow:0 14px 34px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:128px;
}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
.display{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
::selection{background:var(--brass);color:var(--bg)}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:236px 1fr;gap:40px;align-items:start}
@media (max-width:880px){ .shell{grid-template-columns:1fr;gap:24px} }

/* ---------- masthead ---------- */
.masthead{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:40}
.masthead-in{max-width:1240px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:20px}
.wordmark{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.wm-disc{width:26px;height:26px;border-radius:50%;flex:none;
  background:
    radial-gradient(circle at 50% 50%, var(--brass) 0 17%, transparent 18%),
    repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0 1.6px, var(--vinyl-2) 1.6px 2.4px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.wm-text{display:block;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:19px;letter-spacing:.01em;line-height:1}
.wm-sub{display:block;font-size:10px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin-top:3px;font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;min-width:190px}
.search input{border:0;background:none;color:inherit;font:inherit;font-size:14px;width:100%;outline:none}
.search input::placeholder{color:var(--faint)}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn:hover{border-color:var(--brass)}

/* ---------- side rail ---------- */
.rail{position:sticky;top:88px;padding:28px 0 40px}
@media (max-width:880px){ .rail{position:static;padding:8px 0 0} }
.rail-h{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 12px}
.rail-list{list-style:none;margin:0 0 26px;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:880px){ .rail-list{flex-direction:row;flex-wrap:wrap} }
.rail-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;text-align:left;font-size:14px;color:var(--dim)}
.rail-item:hover{background:var(--surface);color:var(--text)}
.rail-item[aria-current="true"]{background:var(--surface);color:var(--text);font-weight:600}
.rail-item[aria-current="true"] .dot{background:var(--brass)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.rail-note{font-size:12px;color:var(--faint);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}

/* ---------- home ---------- */
main{padding:34px 0 40px;min-height:60vh}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 10px}
h1.big{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:clamp(30px,5vw,46px);
  line-height:1.15;margin:0 0 10px;text-wrap:balance;letter-spacing:-.02em}
.lede{color:var(--dim);max-width:60ch;margin:0 0 32px;font-size:15px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:34px 26px;margin:0;padding:0;list-style:none}
.card{width:100%;text-align:left;display:block}
.sleeve-wrap{position:relative;margin-bottom:14px}
.disc-peek{position:absolute;inset:0;border-radius:50%;width:88%;margin:6% 0 0 6%;
  transition:transform .5s cubic-bezier(.22,.8,.24,1);transform:translateX(0) rotate(0deg);z-index:0}
.card:hover .disc-peek,.card:focus-visible .disc-peek{transform:translateX(30%) rotate(24deg)}
.sleeve{position:relative;z-index:1;aspect-ratio:1;border-radius:3px;box-shadow:var(--sleeve-shadow);
  display:grid;place-items:center;overflow:hidden;transition:transform .4s cubic-bezier(.22,.8,.24,1)}
.card:hover .sleeve{transform:translateY(-3px)}
.sleeve::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.14),transparent 42%)}
.sleeve img{width:100%;height:100%;object-fit:cover}
.sleeve-initial{position:relative;z-index:2;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:52px;color:rgba(255,255,255,.94);
  text-shadow:0 2px 14px rgba(0,0,0,.3);line-height:1}
.card-name{font-weight:700;font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
.card-meta{font-size:12.5px;color:var(--faint);margin:0}

/* ---------- artist view ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);margin-bottom:22px}
.back:hover{color:var(--brass)}
.artist-head{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin-bottom:34px}
.artist-sleeve{width:176px;flex:none;aspect-ratio:1;border-radius:3px;box-shadow:var(--sleeve-shadow);display:grid;place-items:center;overflow:hidden;position:relative}
.artist-sleeve img{width:100%;height:100%;object-fit:cover}
.artist-meta{flex:1;min-width:250px}
.artist-name{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;
  font-size:clamp(32px,6vw,58px);line-height:1.05;margin:6px 0 12px;letter-spacing:-.025em;text-wrap:balance}
.artist-bio{color:var(--dim);max-width:56ch;margin:0 0 18px;font-size:14.5px}
.artist-stats{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--faint);flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--dim)}
.play-all{display:inline-flex;align-items:center;gap:9px;background:var(--brass);color:#fff;font-weight:600;
  padding:11px 22px;border-radius:999px;font-size:14px;margin-top:18px;transition:transform .15s,filter .15s}
:root[data-theme="dark"] .play-all,:root:not([data-theme="light"]) .play-all{color:#14100A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .play-all{color:#fff}}
.play-all:hover{transform:scale(1.03);filter:brightness(1.07)}

/* ---------- track list ---------- */
.tl-head{display:grid;grid-template-columns:36px 1fr 92px 56px;gap:14px;padding:0 12px 9px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.track{display:grid;grid-template-columns:36px 1fr 92px 56px;gap:14px;align-items:center;
  width:100%;padding:11px 12px;border-radius:8px;text-align:left;border-bottom:1px solid transparent}
.track:hover{background:var(--surface)}
.track .num{color:var(--faint);font-size:13px;display:grid;place-items:center}
.track:hover .num .n{display:none}
.track .num .p{display:none;color:var(--brass)}
.track:hover .num .p{display:block}
.track-title{display:block;font-size:14.5px;font-weight:500;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-sub{display:block;line-height:1.35;font-size:12px;color:var(--faint);margin:0}
.track .len{font-size:13px;color:var(--faint);text-align:right}
.track .tag{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){
  .tl-head,.track{grid-template-columns:30px 1fr 52px}
  .tl-head .tag,.track .tag{display:none}
}
.track[aria-current="true"] .track-title{color:var(--brass);font-weight:600}
.track[aria-current="true"] .num .n{display:none}
.bars{display:none;gap:2px;align-items:flex-end;height:13px}
.track[aria-current="true"] .bars{display:flex}
.track[aria-current="true"]:hover .num .p{display:none}
.bars i{width:2.5px;background:var(--brass);border-radius:1px;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(1){height:5px;animation-delay:-.1s}
.bars i:nth-child(2){height:12px;animation-delay:-.45s}
.bars i:nth-child(3){height:8px;animation-delay:-.7s}
body.paused .bars i{animation-play-state:paused}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.track.soon{opacity:.42;cursor:default}
.track.soon:hover{background:none}
.track.soon .num .p{display:none}
.demo-flag{font-size:10px;letter-spacing:.1em;border:1px solid var(--line);color:var(--faint);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;font-weight:600}

/* ---------- turntable deck ---------- */
.deck{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--deck);border-top:1px solid var(--line);
  box-shadow:0 -8px 30px rgba(0,0,0,.14)}
.deck-in{max-width:1240px;margin:0 auto;padding:14px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center}
@media (max-width:880px){ .deck-in{grid-template-columns:auto 1fr;gap:16px;padding:12px 16px} .deck-right{display:none} }

/* platter */
.platter{position:relative;width:96px;height:96px;flex:none}
.record{position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 3.5%, var(--label-a,#D6A340) 3.6% 27%, transparent 27.5%),
    repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0 2px, var(--vinyl-2) 2px 3.1px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);
  will-change:transform}
.record::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 12%, rgba(255,255,255,.10) 16%, transparent 22%, transparent 62%, rgba(255,255,255,.07) 68%, transparent 74%)}
.record::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:var(--deck);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.record img{position:absolute;left:50%;top:50%;width:52%;height:52%;margin:-26% 0 0 -26%;border-radius:50%;object-fit:cover}
@media (prefers-reduced-motion: reduce){ .bars i{animation:none} }

/* tonearm */
.tonearm{position:absolute;right:-4px;top:6px;width:14px;height:14px;transform-origin:50% 50%;
  transform:rotate(-30deg);transition:transform .75s cubic-bezier(.4,.1,.2,1);z-index:3}
.tonearm.lift{transition:transform .16s cubic-bezier(.3,0,.2,1)}
.tonearm.drop{transition:transform .42s cubic-bezier(.2,1.5,.45,1)}
.platter.thud{animation:thud .5s cubic-bezier(.25,1.4,.4,1)}
@keyframes thud{0%{transform:translateY(0)}22%{transform:translateY(1.5px)}100%{transform:translateY(0)}}
.tonearm .pivot{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;
  background:linear-gradient(160deg,var(--brass-lit),var(--brass));box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tonearm .arm{position:absolute;left:5px;top:6px;width:62px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--brass),var(--brass-lit));transform-origin:0 50%;transform:rotate(160deg);
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tonearm .arm::after{content:"";position:absolute;right:-2px;top:-3px;width:6px;height:9px;border-radius:1px;
  background:linear-gradient(180deg,var(--brass-lit),var(--brass))}

/* now playing */
.np{min-width:0}
.np-title{font-size:14.5px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-artist{font-size:12.5px;color:var(--faint);margin:0 0 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.ctl{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.ctl:hover{color:var(--text);background:var(--surface-2)}
.ctl.on{color:var(--brass)}
.ctl-main{width:40px;height:40px;background:var(--brass);color:#fff;margin:0 4px}
:root[data-theme="dark"] .ctl-main,:root:not([data-theme="light"]) .ctl-main{color:#14100A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .ctl-main{color:#fff}}
.ctl-main:hover{background:var(--brass-lit);color:#fff;transform:scale(1.05)}
:root[data-theme="dark"] .ctl-main:hover{color:#14100A}
.seekrow{display:flex;align-items:center;gap:11px}
.time{font-size:11.5px;color:var(--faint);min-width:38px}
.time.r{text-align:right}
.seek{position:relative;flex:1;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek-track{position:relative;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seek-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brass);border-radius:2px}
.seek-knob{position:absolute;top:50%;left:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:var(--brass-lit);opacity:0;transition:opacity .15s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.seek:hover .seek-knob,.seek:focus-within .seek-knob{opacity:1}

/* right cluster */
.deck-right{display:flex;align-items:center;gap:14px}
#vu{display:block;width:112px;height:30px}
.vol{display:flex;align-items:center;gap:8px}
.volbar{width:74px;height:4px;border-radius:2px;background:var(--line);position:relative;cursor:pointer}
.volfill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--dim);width:80%}
.volbar:hover .volfill{background:var(--brass)}

/* misc */
.empty{color:var(--faint);font-size:14px;padding:40px 0}
svg{display:block}
svg[hidden]{display:none}
[hidden]{display:none !important}
.is-hidden{display:none !important}

/* 등장 애니메이션 — 프로필이 하나씩 딱딱 */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes riseSoft{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid>li{animation:rise .52s cubic-bezier(.18,.9,.28,1.06) backwards;animation-delay:calc(var(--i,0)*80ms)}
.tl>li{animation:riseSoft .34s ease-out backwards;animation-delay:calc(var(--i,0)*45ms)}
.stagger{animation:riseSoft .46s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.artist-sleeve{animation:rise .55s cubic-bezier(.18,.9,.28,1.06) backwards}
@media (prefers-reduced-motion: reduce){
  .grid>li,.tl>li,.stagger,.artist-sleeve{animation:none}
}
.hint{font-size:12px;color:var(--faint);margin-top:26px;border-top:1px solid var(--line);padding-top:16px;max-width:62ch;line-height:1.75}
.hint code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

/* ---------- 가수 소개 스토리 ---------- */
.note{border-top:1px solid var(--line);margin-top:38px;padding-top:26px}
.note-h{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 18px}
.note p{font-size:15.5px;line-height:1.95;color:var(--dim);margin:0 0 17px;max-width:64ch}
.note p.bodycopy:first-of-type::first-letter{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  font-size:2.9em;float:left;line-height:.86;margin:4px 10px 0 0;color:var(--brass)}
.pullquote{border-left:3px solid var(--brass);padding:6px 0 6px 18px;margin:26px 0 6px;
  font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:clamp(18px,2.4vw,24px);
  line-height:1.5;color:var(--text);letter-spacing:-.01em;max-width:26ch}

/* ---------- 가수 명단 ---------- */
.roster{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
.roster-item{display:grid;grid-template-columns:132px minmax(0,1fr);gap:22px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);
  animation:riseSoft .42s ease-out backwards;animation-delay:calc(var(--i,0)*90ms)}
.roster-item:hover{border-color:var(--brass);transform:translateY(-2px)}
.roster-item{transition:border-color .2s,transform .2s}
.roster-cover{width:132px;height:132px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.roster-cover img{width:100%;height:100%;object-fit:cover;display:block}
.roster-name{display:block;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:26px;margin:2px 0 6px;letter-spacing:-.02em}
.roster-hook{display:block;font-size:14.5px;color:var(--text);margin:0 0 8px;font-weight:500}

/* ================= 목록 끝 · 아래는 손대지 않아도 됩니다 ================= */

const $ = (s) => document.querySelector(s);
const au = $("#au");
const view = $("#view");

/* ---- 곡 목록 평탄화 ---- */
const QUEUE = [];
ARTISTS.forEach((a) => a.tracks.forEach((t, ti) => {
  QUEUE.push({ ...t, artist: a, key: a.id + ":" + ti, index: QUEUE.length });
}));
const PLAYABLE = QUEUE.filter(t => t.src);

/* ---- 재생 기록 (이 기기에 저장) ---- */
const PLAYLOG_KEY = "wevape-singer-plays";
function readLog() {
  try { const v = JSON.parse(localStorage.getItem(PLAYLOG_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function writeLog(list) {
  try { localStorage.setItem(PLAYLOG_KEY, JSON.stringify(list.slice(-6000))); } catch (e) {}
}
function logPlay(key) {
  const l = readLog(); l.push([key, Date.now()]); writeLog(l);
  if (currentView === "chart") { const box = document.getElementById("rankList"); if (box) box.innerHTML = chartRowsHtml(); }
}
const RANGES = { day: 1, week: 7, month: 30 };
const RANGE_LABEL = { day: "일간", week: "주간", month: "월간" };
function rankFor(range) {
  const since = Date.now() - RANGES[range] * 864e5;
  const cnt = {};
  readLog().forEach(([k, t]) => { if (t >= since) cnt[k] = (cnt[k] || 0) + 1; });
  return PLAYABLE.map(t => ({ t, n: cnt[t.key] || 0 })).sort((a, b) => b.n - a.n || a.t.index - b.t.index);
}

$("#labelName").textContent = LABEL.name;
$("#labelSub").textContent = LABEL.sub;
document.title = LABEL.name;

const fmt = (s) => {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ":" + String(r).padStart(2, "0");
};
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const grad = (a) => `linear-gradient(145deg, ${a.color} 0%, ${a.color2} 100%)`;

function sleeveInner(a) {
  return a.photo
    ? `<img src="${esc(a.photo)}" alt="${esc(a.name)} 앨범 커버" loading="lazy">`
    : `<span class="sleeve-initial">${esc(a.name.slice(0, 1))}</span>`;
}
function discCss(a) {
  return `background:radial-gradient(circle at 50% 50%, transparent 0 4%, ${a.color} 4.1% 26%, transparent 26.5%),
    repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0 2.4px, var(--vinyl-2) 2.4px 3.6px);
    box-shadow:0 6px 18px rgba(0,0,0,.35)`;
}

function trackRow(t, i) {
  const isCur = cur && cur.key === t.key;
  const soon = !t.src;
  return `<li style="--i:${i}">
    <button class="track${soon ? " soon" : ""}" data-key="${t.key}" ${soon ? "disabled" : ""} ${isCur ? 'aria-current="true"' : ""}>
      <span class="num mono">
        <span class="n">${i + 1}</span>
        <span class="p"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
        <span class="bars"><i></i><i></i><i></i></span>
      </span>
      <span style="min-width:0">
        <span class="track-title">${esc(t.title)}${soon ? '<span class="demo-flag">준비중</span>' : ""}</span>
        <span class="track-sub">${esc(t.artist.name)}</span>
      </span>
      <span class="tag">${esc(t.tag || "")}</span>
      <span class="len mono">${t.duration ? fmt(t.duration) : "–:––"}</span>
    </button>
  </li>`;
}

function storyHtml(a) {
  if (!a.story || !a.story.length) return "";
  return `<section class="note">
    <p class="note-h">Artist Note · ${esc(a.name)}</p>
    ${a.quote ? `<p class="pullquote">"${esc(a.quote)}"</p>` : ""}
    ${a.story.map(t => `<p class="bodycopy">${esc(t)}</p>`).join("")}
  </section>`;
}

/* 가사: 줄 앞에 [분:초] 를 붙이면 재생에 맞춰 자동으로 따라갑니다 */
let LYRICS = [];
function lyricsHtml(t) {
  LYRICS = [];
  const raw = (t.lyrics || "").trim();
  if (!raw) {
    return `<div class="lyr-empty">아직 가사가 등록되지 않았습니다.<br>
      <code style="font-family:'IBM Plex Mono',monospace;font-size:11.5px">index.html</code> 의 이 곡 항목에 <code style="font-family:'IBM Plex Mono',monospace;font-size:11.5px">lyrics</code> 로 가사를 붙여넣으면 여기에 바로 나옵니다.<br>
      줄 앞에 <b>[0:12]</b> 처럼 시간을 적으면 노래에 맞춰 한 줄씩 따라갑니다.</div>`;
  }
  const lines = raw.split("\n");
  let timed = false, out = "";
  lines.forEach((ln) => {
    const m = ln.match(/^\s*\[(\d+):(\d{1,2})(?:\.(\d+))?\]\s*(.*)$/);
    if (m) {
      timed = true;
      const sec = (+m[1]) * 60 + (+m[2]) + (m[3] ? +("0." + m[3]) : 0);
      const txt = m[4];
      LYRICS.push(sec);
      out += `<p data-t="${sec}" data-i="${LYRICS.length - 1}">${esc(txt || "·")}</p>`;
    } else if (!ln.trim()) {
      out += `<p class="blank"></p>`;
    } else if (/^\s*\[.+\]\s*$/.test(ln)) {
      out += `<p class="sec">${esc(ln.trim().replace(/^\[|\]$/g, ""))}</p>`;
    } else {
      out += `<p>${esc(ln)}</p>`;
    }
  });
  return `<div class="lyr${timed ? " timed" : ""}" id="lyr">${out}</div>`;
}

function syncLyrics() {
  if (!LYRICS.length) return;
  const box = document.getElementById("lyr");
  if (!box || box.offsetParent === null) return;
  let idx = -1;
  for (let i = 0; i < LYRICS.length; i++) if (au.currentTime >= LYRICS[i] - 0.15) idx = i;
  const el = idx >= 0 ? box.querySelector('[data-i="' + idx + '"]') : null;
  if (el && !el.classList.contains("on")) {
    box.querySelectorAll("p.on").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    const top = el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2;
    box.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  }
}

/* =================== 플레이어 =================== */
let cur = null, shuffle = false, repeat = false, seeking = false;
let ac = null, analyser = null, srcNode = null, freq = null;

function ensureAudioGraph() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    ac = new AC();
    srcNode = ac.createMediaElementSource(au);
    analyser = ac.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.75;
    freq = new Uint8Array(analyser.frequencyBinCount);
    srcNode.connect(analyser); analyser.connect(ac.destination);
  } catch (err) { ac = null; analyser = null; }
}

function play(track) {
  if (!track) return;
  ensureAudioGraph();
  const sameTrack = cur && cur.key === track.key;
  if (!track.src) return;
  if (!sameTrack) {
    cur = track;
    logPlay(track.key);
    au.src = track.src;
    au.load();
    const a = track.artist;
    $("#npTitle").textContent = track.title;
    $("#npArtist").textContent = a.name + " · " + a.tag;
    const rec = $("#record");
    rec.style.setProperty("--label-a", a.color);
    const art = $("#recordArt");
    if (a.photo) { art.src = a.photo; art.hidden = false; } else { art.hidden = true; art.removeAttribute("src"); }
    $("#durTime").textContent = track.duration ? fmt(track.duration) : "0:00";
  }
  const wasPlaying = !au.paused;
  au.play().catch(() => {});
  if (!wasPlaying || !sameTrack) setTimeout(() => needleDrop(au.currentTime / (au.duration || 1)), 60);
  renderPlayer(track);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggle() {
  if (!cur) return play(PLAYABLE[0]);
  ensureAudioGraph();
  if (au.paused) { au.play().catch(() => {}); setTimeout(() => needleDrop(au.currentTime / (au.duration || 1)), 60); }
  else au.pause();
}

function step(dir) {
  if (!cur) return play(PLAYABLE[0]);
  if (!PLAYABLE.length) return;
  const i = PLAYABLE.findIndex(t => t.key === cur.key);
  if (shuffle && PLAYABLE.length > 1) {
    let n; do { n = Math.floor(Math.random() * PLAYABLE.length); } while (n === i);
    return play(PLAYABLE[n]);
  }
  play(PLAYABLE[(i + dir + PLAYABLE.length) % PLAYABLE.length]);
}

function refreshRows() {
  document.querySelectorAll(".track").forEach(el => {
    if (cur && el.dataset.key === cur.key) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
}

$("#playBtn").addEventListener("click", toggle);
$("#nextBtn").addEventListener("click", () => step(1));
$("#prevBtn").addEventListener("click", () => { if (au.currentTime > 3) { au.currentTime = 0; } else step(-1); });
$("#shuffleBtn").addEventListener("click", (e) => { shuffle = !shuffle; e.currentTarget.classList.toggle("on", shuffle); });
$("#repeatBtn").addEventListener("click", (e) => { repeat = !repeat; e.currentTarget.classList.toggle("on", repeat); });

  $("#playIcon").classList.remove("is-hidden"); $("#pauseIcon").classList.add("is-hidden");
  $("#playBtn").setAttribute("aria-label", "재생");
  armEls().forEach(({ el }) => { el.classList.remove("drop"); el.classList.add("lift"); });
  setArm(null);
  setTimeout(() => armEls().forEach(({ el }) => el.classList.remove("lift")), 220);
});

});
au.addEventListener("ended", () => { if (repeat) { au.currentTime = 0; au.play(); } else step(1); });
au.addEventListener("timeupdate", () => { if (!seeking) paint(au.currentTime / (au.duration || 1)); syncLyrics(); });

const ARM_SPECS = [
  { sel: "#tonearm", rest: -62, lift: -70, outer: 26, inner: 8 },
  { sel: "#armBig",  rest: 115, lift: 122, outer: 98, inner: 80 }
];
function armEls() { return ARM_SPECS.map(k => ({ el: document.querySelector(k.sel), k })).filter(x => x.el); }
function setArm(p) {
  armEls().forEach(({ el, k }) => {
    const deg = (p === null ? k.rest : (k.outer + p * (k.inner - k.outer)));
    el.style.transform = "rotate(" + deg + "deg)";
  });
}

/* 바늘 올렸다 → 판 위로 탁 내려놓기 */
function needleDrop(p) {
  const platter = document.querySelector(".platter");
  armEls().forEach(({ el, k }) => { el.classList.remove("drop"); el.classList.add("lift"); el.style.transform = "rotate(" + k.lift + "deg)"; });
  setTimeout(() => {
    armEls().forEach(({ el }) => { el.classList.remove("lift"); el.classList.add("drop"); });
    setArm(p || 0);
    if (platter) { platter.classList.remove("thud"); void platter.offsetWidth; platter.classList.add("thud"); }
    crackle();
  }, 170);
  setTimeout(() => armEls().forEach(({ el }) => el.classList.remove("drop")), 900);
}

/* 바늘 닿는 "탁 · 찌직" 소리 */
function crackle() {
  if (!ac) return;
  try {
    const dur = 0.22, n = Math.floor(ac.sampleRate * dur);
    const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) {
      const t = i / ac.sampleRate;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t / dur, 3) * (t < 0.012 ? 1 : 0.28);
    }
    const src = ac.createBufferSource(); src.buffer = b;
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2100; f.Q.value = 0.7;
    const g = ac.createGain(); g.gain.value = 0.5;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  } catch (e) {}
}
function paint(p) {
  p = Math.max(0, Math.min(1, p || 0));
  $("#seekFill").style.width = (p * 100) + "%";
  $("#seekKnob").style.left = (p * 100) + "%";
  $("#seek").setAttribute("aria-valuenow", Math.round(p * 100));
  $("#curTime").textContent = fmt(au.currentTime);
  if (!au.paused) setArm(p);
}

/* 진행바 드래그 */
const seek = $("#seek");
const ratioFrom = (e) => { const r = seek.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
seek.addEventListener("pointerdown", (e) => { if (!cur) return; seeking = true; seek.setPointerCapture(e.pointerId); const p = ratioFrom(e); paint(p); setArm(p); });
seek.addEventListener("pointermove", (e) => { if (!seeking) return; const p = ratioFrom(e); paint(p); setArm(p); });
seek.addEventListener("pointerup", (e) => { if (!seeking) return; seeking = false; if (isFinite(au.duration)) au.currentTime = ratioFrom(e) * au.duration; });
seek.addEventListener("keydown", (e) => {
  if (!cur || !isFinite(au.duration)) return;
  if (e.key === "ArrowRight") { au.currentTime = Math.min(au.duration, au.currentTime + 5); e.preventDefault(); }
  if (e.key === "ArrowLeft") { au.currentTime = Math.max(0, au.currentTime - 5); e.preventDefault(); }
});

/* 볼륨 */
const volBar = $("#volBar");
au.volume = 0.8;
const setVol = (e) => { const r = volBar.getBoundingClientRect(); const v = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); au.volume = v; $("#volFill").style.width = (v * 100) + "%"; volBar.setAttribute("aria-valuenow", Math.round(v * 100)); };
let volDrag = false;
volBar.addEventListener("pointerdown", (e) => { volDrag = true; volBar.setPointerCapture(e.pointerId); setVol(e); });
volBar.addEventListener("pointermove", (e) => { if (volDrag) setVol(e); });
volBar.addEventListener("pointerup", () => { volDrag = false; });
volBar.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    au.volume = Math.max(0, Math.min(1, au.volume + (e.key === "ArrowRight" ? .05 : -.05)));
    $("#volFill").style.width = (au.volume * 100) + "%"; volBar.setAttribute("aria-valuenow", Math.round(au.volume * 100)); e.preventDefault();
  }
});

/* 턴테이블 회전 + 레벨 미터 — 한 루프에서 처리 */
const vu = $("#vu"), vctx = vu.getContext("2d");
const recordEl = $("#record");
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const RPM_DEG = 200;              // 33 1/3 rpm 느낌 (초당 회전 각도)
let angle = 0, vel = 0, last = 0, looping = false;

function startLoop() { if (!looping) { looping = true; last = performance.now(); requestAnimationFrame(loop); } }

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const target = au.paused ? 0 : RPM_DEG;

  // 턴테이블: 목표 속도까지 서서히 붙었다가, 멈출 땐 관성으로 천천히 정지
  vel += (target - vel) * Math.min(1, dt * (au.paused ? 1.6 : 5.5));
  angle = (angle + vel * dt) % 360;
  if (!REDUCED) {
    const rot = "rotate(" + angle.toFixed(2) + "deg)";
    recordEl.style.transform = rot;
    const big = document.getElementById("lp");
    if (big) big.style.transform = rot;
  }

  // 레벨 미터
  vctx.clearRect(0, 0, vu.width, vu.height);
  const css = getComputedStyle(document.documentElement);
  const brass = css.getPropertyValue("--brass").trim() || "#D6A340";
  const line = css.getPropertyValue("--line").trim() || "#333";
  const bars = 22, gap = 2, w = (vu.width - gap * (bars - 1)) / bars;
  if (analyser) analyser.getByteFrequencyData(freq);
  const damp = au.paused ? Math.max(0, vel / RPM_DEG) : 1;
  for (let k = 0; k < bars; k++) {
    const raw = analyser ? freq[Math.floor(k * freq.length / bars / 1.6)] / 255 : 0.3;
    const h = Math.max(2, Math.pow(raw, 1.25) * vu.height * damp);
    vctx.fillStyle = line; vctx.fillRect(k * (w + gap), 0, w, vu.height);
    vctx.fillStyle = brass; vctx.fillRect(k * (w + gap), vu.height - h, w, h);
  }

  if (!au.paused || vel > 0.5) requestAnimationFrame(loop);
  else { looping = false; vctx.clearRect(0, 0, vu.width, vu.height); }
}

/* 키보드 */
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.code === "ArrowRight" && e.shiftKey) step(1);
  if (e.code === "ArrowLeft" && e.shiftKey) step(-1);
});

/* 테마 */
$("#themeBtn").addEventListener("click", () => {
  const curTheme = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = curTheme ? curTheme === "dark" : sysDark;
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
});

/* ---- 앱 설치 (PWA) ---- */
let deferredPrompt = null;
const installBtn = $("#installBtn"), installTip = $("#installTip");
const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e;
  if (!standalone) installBtn.classList.add("show");
});
window.addEventListener("appinstalled", () => { installBtn.classList.remove("show"); deferredPrompt = null; });
if (!standalone) installBtn.classList.add("show");

installBtn.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice.catch(() => null);
    if (r && r.outcome === "accepted") installBtn.classList.remove("show");
    deferredPrompt = null;
    return;
  }
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua);
  const android = /Android/.test(ua);
  $("#installHow").innerHTML = ios
    ? '사파리 아래쪽 <b>공유 버튼</b>(↑) → <b>홈 화면에 추가</b> 를 누르면 앱처럼 설치됩니다.'
    : android
      ? '브라우저 우측 상단 <b>⋮ 메뉴</b> → <b>앱 설치</b>(또는 홈 화면에 추가) 를 누르면 됩니다.'
      : '크롬 주소창 오른쪽 끝의 <b>설치 아이콘</b>(⤓) 을 누르거나, <b>⋮ 메뉴 → 캐스트·저장 및 공유 → 페이지를 앱으로 설치</b> 를 선택하세요.';
  installTip.classList.add("show");
});
$("#installTipClose").addEventListener("click", () => installTip.classList.remove("show"));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

setArm(null);
renderHome();
</script>
</body>
</html>
