<style>
:root{
  --bg:#F0EBE1; --surface:#FAF7F1; --surface-2:#E7E0D3; --line:#D6CCB9;
  --text:#191C21; --dim:#6B6255; --faint:#9A9184;
  --brass:#9E6F16; --brass-lit:#C08D26; --brass-dim:#C9B78A;
  --vinyl:#17181B; --vinyl-2:#303239; --groove:rgba(255,255,255,.07);
  --deck:#E4DCCC; --shadow:0 1px 2px rgba(30,22,8,.10), 0 8px 28px rgba(30,22,8,.10);
  --sleeve-shadow:0 10px 30px rgba(30,22,8,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E12; --surface:#14171D; --surface-2:#1B1F27; --line:#292E38;
    --text:#ECE6DA; --dim:#98A0AC; --faint:#6C737E;
    --brass:#D6A340; --brass-lit:#EFC46A; --brass-dim:#7A6132;
    --vinyl:#08090B; --vinyl-2:#1D1F25; --groove:rgba(255,255,255,.055);
    --deck:#101319; --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 34px rgba(0,0,0,.55);
    --sleeve-shadow:0 14px 34px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E12; --surface:#14171D; --surface-2:#1B1F27; --line:#292E38;
  --text:#ECE6DA; --dim:#98A0AC; --faint:#6C737E;
  --brass:#D6A340; --brass-lit:#EFC46A; --brass-dim:#7A6132;
  --vinyl:#08090B; --vinyl-2:#1D1F25; --groove:rgba(255,255,255,.055);
  --deck:#101319; --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 34px rgba(0,0,0,.55);
  --sleeve-shadow:0 14px 34px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:128px;
}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
.display{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
::selection{background:var(--brass);color:var(--bg)}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:236px 1fr;gap:40px;align-items:start}
@media (max-width:880px){ .shell{grid-template-columns:1fr;gap:24px} }

/* ---------- masthead ---------- */
.masthead{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:40}
.masthead-in{max-width:1240px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:20px}
.wordmark{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.wm-disc{width:26px;height:26px;border-radius:50%;flex:none;
  background:
    radial-gradient(circle at 50% 50%, var(--brass) 0 17%, transparent 18%),
    repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0 1.6px, var(--vinyl-2) 1.6px 2.4px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.wm-text{display:block;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:19px;letter-spacing:.01em;line-height:1}
.wm-sub{display:block;font-size:10px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin-top:3px;font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;min-width:190px}
.search input{border:0;background:none;color:inherit;font:inherit;font-size:14px;width:100%;outline:none}
.search input::placeholder{color:var(--faint)}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn:hover{border-color:var(--brass)}

/* ---------- side rail ---------- */
.rail{position:sticky;top:88px;padding:28px 0 40px}
@media (max-width:880px){ .rail{position:static;padding:8px 0 0} }
.rail-h{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 12px}
.rail-list{list-style:none;margin:0 0 26px;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:880px){ .rail-list{flex-direction:row;flex-wrap:wrap} }
.rail-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;text-align:left;font-size:14px;color:var(--dim)}
.rail-item:hover{background:var(--surface);color:var(--text)}
.rail-item[aria-current="true"]{background:var(--surface);color:var(--text);font-weight:600}
.rail-item[aria-current="true"] .dot{background:var(--brass)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.rail-note{font-size:12px;color:var(--faint);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}

/* ---------- home ---------- */
main{padding:34px 0 40px;min-height:60vh}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 10px}
h1.big{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:clamp(30px,5vw,46px);
  line-height:1.15;margin:0 0 10px;text-wrap:balance;letter-spacing:-.02em}
.lede{color:var(--dim);max-width:60ch;margin:0 0 32px;font-size:15px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:34px 26px;margin:0;padding:0;list-style:none}
.card{width:100%;text-align:left;display:block}
.sleeve-wrap{position:relative;margin-bottom:14px}
.disc-peek{position:absolute;inset:0;border-radius:50%;width:88%;margin:6% 0 0 6%;
  transition:transform .5s cubic-bezier(.22,.8,.24,1);transform:translateX(0) rotate(0deg);z-index:0}
.card:hover .disc-peek,.card:focus-visible .disc-peek{transform:translateX(30%) rotate(24deg)}
.sleeve{position:relative;z-index:1;aspect-ratio:1;border-radius:3px;box-shadow:var(--sleeve-shadow);
  display:grid;place-items:center;overflow:hidden;transition:transform .4s cubic-bezier(.22,.8,.24,1)}
.card:hover .sleeve{transform:translateY(-3px)}
.sleeve::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.14),transparent 42%)}
.sleeve img{width:100%;height:100%;object-fit:cover}
.sleeve-initial{position:relative;z-index:2;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:52px;color:rgba(255,255,255,.94);
  text-shadow:0 2px 14px rgba(0,0,0,.3);line-height:1}
.card-name{font-weight:700;font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
.card-meta{font-size:12.5px;color:var(--faint);margin:0}

/* ---------- artist view ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);margin-bottom:22px}
.back:hover{color:var(--brass)}
.artist-head{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin-bottom:34px}
.artist-sleeve{width:176px;flex:none;aspect-ratio:1;border-radius:3px;box-shadow:var(--sleeve-shadow);display:grid;place-items:center;overflow:hidden;position:relative}
.artist-sleeve img{width:100%;height:100%;object-fit:cover}
.artist-meta{flex:1;min-width:250px}
.artist-name{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;
  font-size:clamp(32px,6vw,58px);line-height:1.05;margin:6px 0 12px;letter-spacing:-.025em;text-wrap:balance}
.artist-bio{color:var(--dim);max-width:56ch;margin:0 0 18px;font-size:14.5px}
.artist-stats{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--faint);flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--dim)}
.play-all{display:inline-flex;align-items:center;gap:9px;background:var(--brass);color:#fff;font-weight:600;
  padding:11px 22px;border-radius:999px;font-size:14px;margin-top:18px;transition:transform .15s,filter .15s}
:root[data-theme="dark"] .play-all,:root:not([data-theme="light"]) .play-all{color:#14100A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .play-all{color:#fff}}
.play-all:hover{transform:scale(1.03);filter:brightness(1.07)}

/* ---------- track list ---------- */
.tl-head{display:grid;grid-template-columns:36px 1fr 92px 56px;gap:14px;padding:0 12px 9px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.track{display:grid;grid-template-columns:36px 1fr 92px 56px;gap:14px;align-items:center;
  width:100%;padding:11px 12px;border-radius:8px;text-align:left;border-bottom:1px solid transparent}
.track:hover{background:var(--surface)}
.track .num{color:var(--faint);font-size:13px;display:grid;place-items:center}
.track:hover .num .n{display:none}
.track .num .p{display:none;color:var(--brass)}
.track:hover .num .p{display:block}
.track-title{display:block;font-size:14.5px;font-weight:500;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-sub{display:block;line-height:1.35;font-size:12px;color:var(--faint);margin:0}
.track .len{font-size:13px;color:var(--faint);text-align:right}
.track .tag{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){
  .tl-head,.track{grid-template-columns:30px 1fr 52px}
  .tl-head .tag,.track .tag{display:none}
}
.track[aria-current="true"] .track-title{color:var(--brass);font-weight:600}
.track[aria-current="true"] .num .n{display:none}
.bars{display:none;gap:2px;align-items:flex-end;height:13px}
.track[aria-current="true"] .bars{display:flex}
.track[aria-current="true"]:hover .num .p{display:none}
.bars i{width:2.5px;background:var(--brass);border-radius:1px;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(1){height:5px;animation-delay:-.1s}
.bars i:nth-child(2){height:12px;animation-delay:-.45s}
.bars i:nth-child(3){height:8px;animation-delay:-.7s}
body.paused .bars i{animation-play-state:paused}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.track.soon{opacity:.42;cursor:default}
.track.soon:hover{background:none}
.track.soon .num .p{display:none}
.demo-flag{font-size:10px;letter-spacing:.1em;border:1px solid var(--line);color:var(--faint);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;font-weight:600}

/* ---------- turntable deck ---------- */
.deck{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--deck);border-top:1px solid var(--line);
  box-shadow:0 -8px 30px rgba(0,0,0,.14)}
.deck-in{max-width:1240px;margin:0 auto;padding:14px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center}
@media (max-width:880px){ .deck-in{grid-template-columns:auto 1fr;gap:16px;padding:12px 16px} .deck-right{display:none} }

/* platter */
.platter{position:relative;width:96px;height:96px;flex:none}
.record{position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 3.5%, var(--label-a,#D6A340) 3.6% 27%, transparent 27.5%),
    repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0 2px, var(--vinyl-2) 2px 3.1px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);
  will-change:transform}
.record::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 12%, rgba(255,255,255,.10) 16%, transparent 22%, transparent 62%, rgba(255,255,255,.07) 68%, transparent 74%)}
.record::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:var(--deck);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.record img{position:absolute;left:50%;top:50%;width:52%;height:52%;margin:-26% 0 0 -26%;border-radius:50%;object-fit:cover}
@media (prefers-reduced-motion: reduce){ .bars i{animation:none} }

/* tonearm */
.tonearm{position:absolute;right:-4px;top:6px;width:14px;height:14px;transform-origin:50% 50%;
  transform:rotate(-30deg);transition:transform .75s cubic-bezier(.4,.1,.2,1);z-index:3}
.tonearm.lift{transition:transform .16s cubic-bezier(.3,0,.2,1)}
.tonearm.drop{transition:transform .42s cubic-bezier(.2,1.5,.45,1)}
.platter.thud{animation:thud .5s cubic-bezier(.25,1.4,.4,1)}
@keyframes thud{0%{transform:translateY(0)}22%{transform:translateY(1.5px)}100%{transform:translateY(0)}}
.tonearm .pivot{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;
  background:linear-gradient(160deg,var(--brass-lit),var(--brass));box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tonearm .arm{position:absolute;left:5px;top:6px;width:62px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--brass),var(--brass-lit));transform-origin:0 50%;transform:rotate(160deg);
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tonearm .arm::after{content:"";position:absolute;right:-2px;top:-3px;width:6px;height:9px;border-radius:1px;
  background:linear-gradient(180deg,var(--brass-lit),var(--brass))}

/* now playing */
.np{min-width:0}
.np-title{font-size:14.5px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-artist{font-size:12.5px;color:var(--faint);margin:0 0 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.ctl{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.ctl:hover{color:var(--text);background:var(--surface-2)}
.ctl.on{color:var(--brass)}
.ctl-main{width:40px;height:40px;background:var(--brass);color:#fff;margin:0 4px}
:root[data-theme="dark"] .ctl-main,:root:not([data-theme="light"]) .ctl-main{color:#14100A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .ctl-main{color:#fff}}
.ctl-main:hover{background:var(--brass-lit);color:#fff;transform:scale(1.05)}
:root[data-theme="dark"] .ctl-main:hover{color:#14100A}
.seekrow{display:flex;align-items:center;gap:11px}
.time{font-size:11.5px;color:var(--faint);min-width:38px}
.time.r{text-align:right}
.seek{position:relative;flex:1;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek-track{position:relative;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seek-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brass);border-radius:2px}
.seek-knob{position:absolute;top:50%;left:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:var(--brass-lit);opacity:0;transition:opacity .15s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.seek:hover .seek-knob,.seek:focus-within .seek-knob{opacity:1}

/* right cluster */
.deck-right{display:flex;align-items:center;gap:14px}
#vu{display:block;width:112px;height:30px}
.vol{display:flex;align-items:center;gap:8px}
.volbar{width:74px;height:4px;border-radius:2px;background:var(--line);position:relative;cursor:pointer}
.volfill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--dim);width:80%}
.volbar:hover .volfill{background:var(--brass)}

/* misc */
.empty{color:var(--faint);font-size:14px;padding:40px 0}
svg{display:block}
svg[hidden]{display:none}
[hidden]{display:none !important}
.is-hidden{display:none !important}

/* 등장 애니메이션 — 프로필이 하나씩 딱딱 */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes riseSoft{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid>li{animation:rise .52s cubic-bezier(.18,.9,.28,1.06) backwards;animation-delay:calc(var(--i,0)*80ms)}
.tl>li{animation:riseSoft .34s ease-out backwards;animation-delay:calc(var(--i,0)*45ms)}
.stagger{animation:riseSoft .46s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.artist-sleeve{animation:rise .55s cubic-bezier(.18,.9,.28,1.06) backwards}
@media (prefers-reduced-motion: reduce){
  .grid>li,.tl>li,.stagger,.artist-sleeve{animation:none}
}
.hint{font-size:12px;color:var(--faint);margin-top:26px;border-top:1px solid var(--line);padding-top:16px;max-width:62ch;line-height:1.75}
.hint code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

/* ---------- 앨범 블록 ---------- */
.album{margin-top:40px;animation:riseSoft .45s ease-out backwards;animation-delay:calc(var(--i,0)*110ms)}
.album-head{display:flex;gap:22px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}
.album-cover{width:148px;height:148px;flex:none;border-radius:5px;overflow:hidden;box-shadow:var(--sleeve-shadow);background:var(--surface-2)}
.album-cover img{width:100%;height:100%;object-fit:cover;display:block}
.album-title{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:clamp(22px,3vw,32px);
  line-height:1.15;margin:2px 0 4px;letter-spacing:-.02em}
.album-en{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.2em;color:var(--brass);margin:0 0 10px}
.album-note{font-size:13.5px;color:var(--dim);line-height:1.8;margin:0 0 12px;max-width:58ch}
@media (max-width:620px){ .album-cover{width:104px;height:104px} .album-head{gap:14px} }


/* ---------- DJ 모드 ---------- */
body.dj-mode > .deck{display:none !important}
body.dj-mode main{padding-bottom:40px}
.dj-wrap{margin-top:22px}
.dj-decks{display:grid;grid-template-columns:1fr 132px 1fr;gap:16px;align-items:stretch}
.dj-deck{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:15px 16px 17px;min-width:0}
.dj-deck.live{border-color:var(--brass);box-shadow:0 0 0 1px rgba(201,162,39,.25)}
.dj-h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.dj-tag{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:21px;line-height:1;color:var(--brass);letter-spacing:.02em}
.dj-state{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);margin-left:auto;letter-spacing:.06em}
.dj-state.on{color:var(--brass)}
.dj-deck select{width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;margin-bottom:11px}
.dj-art{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.dj-art img{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none;background:var(--surface-2)}
.dj-meta{min-width:0}
.dj-title{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dj-sub{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.dj-prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:2px 0 4px}
.dj-prog i{display:block;height:100%;width:0;background:var(--brass);border-radius:3px}
.dj-time{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);margin-bottom:11px}
.dj-btns{display:flex;gap:7px;margin-bottom:12px}
.dbtn{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:9px;padding:9px 4px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.15s}
.dbtn:hover{border-color:var(--brass);color:var(--brass)}
.dbtn.main{background:var(--brass);border-color:var(--brass);color:#17130a;font-weight:700}
.dbtn.main.on{background:transparent;color:var(--brass)}
.dj-knob{margin-bottom:9px}
.dj-knob label{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);margin-bottom:5px;letter-spacing:.05em}
.dj-knob label b{color:var(--brass);font-weight:600}
input[type=range].sl{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--surface-2);outline:none;cursor:pointer}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--brass);border:2px solid var(--surface);cursor:pointer}
input[type=range].sl::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--brass);border:2px solid var(--surface);cursor:pointer}
.xfader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 10px}
.xf-label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--faint)}
.xf-ab{display:flex;justify-content:space-between;width:100%;font-family:"Black Han Sans",sans-serif;font-size:15px;color:var(--brass)}
.xfader input[type=range]{width:100%}
.xfader .dbtn{flex:none;width:100%;padding:8px 4px;font-size:11.5px}
.xfader .sl{margin:4px 0}
.dj-hint{font-size:12px;color:var(--faint);margin:16px 0 8px;line-height:1.85}
.dj-hint kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--dim);margin:0 1px}
.jogwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:20px 0 4px;
  border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:20px 16px 22px}
.jog{position:relative;width:min(248px,62vw);aspect-ratio:1;border-radius:50%;cursor:grab;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px var(--line)}
.jog.grab{cursor:grabbing;box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 0 2px var(--brass)}
.jog.off{opacity:.4;cursor:default}
.jog-disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0 2.6px, var(--vinyl-2) 2.6px 4px)}
.jog-label{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;
  overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.jog-label img{width:100%;height:100%;object-fit:cover;display:block}
.jog-hub{position:absolute;left:50%;top:50%;width:5.5%;height:5.5%;margin:-2.75% 0 0 -2.75%;
  border-radius:50%;background:var(--bg,#0C0E12);box-shadow:0 0 0 2px rgba(0,0,0,.6);z-index:3}
.jog-mark{position:absolute;left:50%;top:4%;width:3px;height:16%;margin-left:-1.5px;border-radius:2px;
  background:var(--brass);opacity:.85;z-index:2}
.jog-cap{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;color:var(--faint);text-align:center}
.jog-cap b{color:var(--brass)}
.jog-speed{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--brass);min-height:15px}
.padgroup{margin-top:18px}
.pad-lab{display:flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.14em;color:var(--faint);margin:0 0 9px}
.pad-lab::after{content:"";flex:1;height:1px;background:var(--line)}
.pad-lab b{color:var(--brass);font-weight:600;letter-spacing:.1em}
.pad-lab.n b{color:#D6459B}
.pad-lab.d b{color:#E0322B}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad{position:relative;aspect-ratio:1.35/1;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;color:var(--text);overflow:hidden;transition:transform .06s,box-shadow .12s,border-color .12s;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pad:active,.pad.hit{transform:scale(.955)}
.pad-hook{border-color:rgba(201,162,39,.34)}
.pad-hook.hit{background:var(--brass);color:#17130a;border-color:var(--brass);box-shadow:0 0 22px rgba(201,162,39,.6)}
.pad-drum{border-color:rgba(224,50,43,.3)}
.pad-drum.hit{background:#E0322B;color:#fff;border-color:#E0322B;box-shadow:0 0 22px rgba(224,50,43,.6)}
.pad-song{border-color:rgba(90,168,255,.32)}
.pad-song.hit{background:#3E8BE0;color:#fff;border-color:#3E8BE0;box-shadow:0 0 22px rgba(62,139,224,.6)}
.pad-song.busy{border-color:#3E8BE0;box-shadow:0 0 16px rgba(62,139,224,.45)}
.pad-song.busy .pad-name{color:#7FB6F0}
.pad-alb{font-size:10.5px;color:var(--faint);margin-top:1px;max-width:92%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pad-lab.s b{color:#3E8BE0}
.pad-night{border-color:rgba(214,69,155,.32)}
.pad-night.hit{background:#D6459B;color:#fff;border-color:#D6459B;box-shadow:0 0 22px rgba(214,69,155,.62)}
.pad.busy{border-color:#D6459B;box-shadow:0 0 16px rgba(214,69,155,.42)}
.pad-n{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;opacity:.55}
.pad-name{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.pad-key{position:absolute;top:6px;right:8px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;opacity:.42}
.pad.dim{opacity:.4}
@media (max-width:760px){
  .dj-decks{grid-template-columns:1fr;gap:12px}
  .pads{gap:7px}
  .pad{aspect-ratio:1/1;border-radius:10px}
  .pad-name{font-size:11.5px}
}

/* ---------- 조회수 ---------- */
.pc{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);letter-spacing:-.01em}
.track[aria-current="true"] .pc{color:var(--brass)}

/* ---------- 신곡 화면 ---------- */
.newgrid{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.newcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;background:var(--surface);transition:border-color .2s,transform .2s;
  animation:riseSoft .42s ease-out backwards;animation-delay:calc(var(--i,0)*90ms)}
.newcard:hover{border-color:var(--brass);transform:translateY(-3px)}
.newcard-cover{position:relative;display:block;width:100%;aspect-ratio:1;background:var(--surface-2)}
.newcard-cover img{width:100%;height:100%;object-fit:cover;display:block}
.newcard-cover .badge-new{position:absolute;top:9px;right:9px;margin:0}
.newcard-body{display:block;padding:13px 14px 15px}
.newcard-title{display:block;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:18px;
  letter-spacing:-.02em;margin:0 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newcard-sub{display:block;font-size:12.5px;color:var(--dim);margin:0 0 9px}
.newcard-meta{display:flex;gap:8px;align-items:center;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--faint)}
.weekbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 2px;
  padding:11px 15px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  font-size:12.5px;color:var(--dim)}
.weekbar b{color:var(--text);font-weight:600}

/* ---------- 신곡 배지 ---------- */
.badge-new{display:inline-block;vertical-align:middle;margin-left:7px;padding:1px 6px 2px;border-radius:4px;
  background:#E0322B;color:#fff;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.09em;line-height:1.5;box-shadow:0 0 0 1px rgba(224,50,43,.35),0 2px 8px rgba(224,50,43,.34);
  animation:newpulse 2.1s ease-in-out infinite}
@keyframes newpulse{0%,100%{box-shadow:0 0 0 1px rgba(224,50,43,.35),0 2px 8px rgba(224,50,43,.34)}
  50%{box-shadow:0 0 0 1px rgba(224,50,43,.6),0 2px 14px rgba(224,50,43,.62)}}
.dot-new{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E0322B;margin-left:6px;
  vertical-align:middle;box-shadow:0 0 7px rgba(224,50,43,.85);animation:newpulse 2.1s ease-in-out infinite}
.card{position:relative}
.sleeve-wrap .badge-corner{position:absolute;top:8px;right:8px;z-index:4;margin:0}
.btn-ghost .badge-new{margin-left:6px}
@media (prefers-reduced-motion:reduce){.badge-new,.dot-new{animation:none}}

/* ---------- 가수 소개 스토리 ---------- */
.note{border-top:1px solid var(--line);margin-top:38px;padding-top:26px}
.note-h{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 18px}
.note p{font-size:15.5px;line-height:1.95;color:var(--dim);margin:0 0 17px;max-width:64ch}
.note p.bodycopy:first-of-type::first-letter{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  font-size:2.9em;float:left;line-height:.86;margin:4px 10px 0 0;color:var(--brass)}
.pullquote{border-left:3px solid var(--brass);padding:6px 0 6px 18px;margin:26px 0 6px;
  font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:clamp(18px,2.4vw,24px);
  line-height:1.5;color:var(--text);letter-spacing:-.01em;max-width:26ch}

/* ---------- 가수 명단 ---------- */
.roster{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
.roster-item{display:grid;grid-template-columns:132px minmax(0,1fr);gap:22px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);
  animation:riseSoft .42s ease-out backwards;animation-delay:calc(var(--i,0)*90ms)}
.roster-item:hover{border-color:var(--brass);transform:translateY(-2px)}
.roster-item{transition:border-color .2s,transform .2s}
.roster-cover{width:132px;height:132px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.roster-cover img{width:100%;height:100%;object-fit:cover;display:block}
.roster-name{display:block;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:26px;margin:2px 0 6px;letter-spacing:-.02em}
.roster-hook{display:block;font-size:14.5px;color:var(--text);margin:0 0 8px;font-weight:500}
.roster-bio{display:block;font-size:13px;color:var(--faint);margin:0 0 12px;line-height:1.7}
.roster-meta{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:620px){
  .roster-item{grid-template-columns:88px minmax(0,1fr);gap:14px;padding:12px}
  .roster-cover{width:88px;height:88px}
  .roster-name{font-size:20px}
  .note p.bodycopy:first-of-type::first-letter{font-size:2.4em}
}

/* ---------- 인기차트 ---------- */
.chart-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.chart-note{font-size:12px;color:var(--faint);margin:14px 0 0;line-height:1.7}
.ranks{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rank{display:grid;grid-template-columns:58px 62px minmax(0,1fr) 96px;gap:16px;align-items:center;
  width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  animation:riseSoft .4s ease-out backwards;animation-delay:calc(var(--i,0)*70ms)}
.rank:hover{border-color:var(--brass)}
.rank.top{border-color:var(--brass);background:linear-gradient(100deg,var(--surface) 60%,rgba(214,163,64,.10))}
.rank-no{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:26px;line-height:1;color:var(--faint);text-align:center}
.rank.top .rank-no{color:var(--brass);font-size:32px}
.rank-no small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:10px;letter-spacing:.14em;margin-top:4px;opacity:.75}
.rank-cover{width:62px;height:62px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.rank-cover img{width:100%;height:100%;object-fit:cover;display:block}
.rank-title{display:block;font-weight:700;font-size:15.5px;margin:0 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{display:block;font-size:12.5px;color:var(--faint);margin:0 0 8px}
.rank-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.rank-bar i{display:block;height:100%;background:var(--brass);border-radius:3px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.rank-cnt{text-align:right}
.rank-cnt b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:19px;color:var(--text)}
.rank-cnt span{font-size:11px;color:var(--faint)}
@media (max-width:620px){
  .rank{grid-template-columns:40px 48px minmax(0,1fr) 64px;gap:10px;padding:10px}
  .rank-cover{width:48px;height:48px}
  .rank-no{font-size:20px}
  .rank.top .rank-no{font-size:24px}
  .rank-cnt b{font-size:15px}
}

/* ---------- 전체 재생 ---------- */
.allbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 34px}
.btn-brass{display:inline-flex;align-items:center;gap:9px;background:var(--brass);color:#fff;font-weight:600;
  padding:11px 22px;border-radius:999px;font-size:14px;transition:transform .15s,filter .15s}
:root[data-theme="dark"] .btn-brass,:root:not([data-theme="light"]) .btn-brass{color:#14100A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn-brass{color:#fff}}
.btn-brass:hover{transform:scale(1.03);filter:brightness(1.07)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);color:var(--dim);
  padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500}
.btn-ghost:hover{border-color:var(--brass);color:var(--text)}
.rail-all{margin-bottom:4px}
.install-btn{display:none;align-items:center;gap:7px;border:1px solid var(--brass);color:var(--brass);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;white-space:nowrap}
.install-btn.show{display:inline-flex}
.install-btn:hover{background:var(--brass);color:#14100A}
.install-tip{display:none;position:fixed;left:50%;bottom:140px;transform:translateX(-50%);z-index:80;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;max-width:340px;
  box-shadow:var(--shadow);font-size:13px;line-height:1.75;color:var(--dim)}
.install-tip.show{display:block}
.install-tip b{color:var(--text)}
.install-tip button{margin-top:10px;font-size:12px;color:var(--brass);font-weight:600}

/* ---------- 앨범 플레이어 화면 ---------- */
.player{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:42px;align-items:start}
@media (max-width:960px){ .player{grid-template-columns:1fr;gap:30px} }

.stage{position:relative;width:100%;max-width:490px;aspect-ratio:1/.64;margin:6px auto 0}
.jacket{position:absolute;left:0;top:6.2%;width:56%;aspect-ratio:1;z-index:2;border-radius:3px;overflow:hidden;
  background:var(--surface-2);box-shadow:0 18px 44px rgba(0,0,0,.42), 0 0 0 1px rgba(0,0,0,.35);
  animation:rise .55s cubic-bezier(.18,.9,.28,1.06) backwards}
.jacket img{width:100%;height:100%;object-fit:cover;display:block}
.jacket::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg, rgba(255,255,255,.16) 0 6%, transparent 22%)}
.disc-zone{position:absolute;left:43%;top:7%;width:55%;aspect-ratio:1;
  animation:slideout .85s cubic-bezier(.2,.85,.3,1) .12s backwards}
@keyframes slideout{from{left:22%;opacity:.35}to{left:43%;opacity:1}}
@media (prefers-reduced-motion: reduce){ .jacket,.disc-zone{animation:none} }
.lp{position:absolute;inset:0;z-index:1;border-radius:50%;overflow:hidden;background:#08090B;
  box-shadow:0 22px 54px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.7);will-change:transform;cursor:pointer}
.lp-art{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center;filter:saturate(1.06) brightness(1.05);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0 92%, transparent 92.6%);
  mask-image:radial-gradient(circle at 50% 50%, #000 0 92%, transparent 92.6%)}
.lp-grooves{position:absolute;inset:0;border-radius:50%;opacity:.34;
  background:repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.5) 0 2.6px, rgba(255,255,255,.14) 2.6px 4.6px)}
.lp-rim{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, transparent 0 91.5%, #0A0B0D 92% 100%)}
.lp-hub{position:absolute;left:50%;top:50%;width:11%;height:11%;margin:-5.5% 0 0 -5.5%;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--deck) 0 15%, rgba(0,0,0,.72) 16% 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.6), inset 0 0 12px rgba(0,0,0,.8)}
.lp-sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
  background:conic-gradient(from 210deg, transparent 0 8%, rgba(255,255,255,.16) 13%, transparent 19%, transparent 55%, rgba(255,255,255,.10) 61%, transparent 67%)}

.arm-big{position:absolute;left:89%;top:82%;width:8%;height:8%;transform-origin:50% 50%;z-index:3;
  transform:rotate(115deg);transition:transform .75s cubic-bezier(.4,.1,.2,1)}
.arm-big.lift{transition:transform .16s cubic-bezier(.3,0,.2,1)}
.arm-big.drop{transition:transform .44s cubic-bezier(.2,1.5,.45,1)}
.arm-big .pivot{position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,var(--brass-lit),var(--brass));
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
.arm-big .arm{position:absolute;left:50%;top:50%;width:1030%;height:9%;min-height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--brass),var(--brass-lit));transform-origin:0 50%;transform:rotate(160deg) translateY(-50%);
  box-shadow:0 2px 6px rgba(0,0,0,.45)}
.arm-big .arm{width:750%}
.arm-big .arm::after{content:"";position:absolute;right:-1%;top:-160%;width:8%;height:420%;border-radius:2px;
  background:linear-gradient(180deg,var(--brass-lit),var(--brass));box-shadow:0 2px 7px rgba(0,0,0,.5)}
.arm-big .arm::before{content:"";position:absolute;right:6%;top:340%;width:2.4%;height:150%;background:var(--brass-lit)}

.np-eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 10px;
  display:flex;align-items:center;gap:9px}
.np-eyebrow .live{width:6px;height:6px;border-radius:50%;background:var(--brass);animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
.np-big{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;
  font-size:clamp(28px,4.4vw,44px);line-height:1.12;margin:0 0 10px;letter-spacing:-.025em;text-wrap:balance}
.np-line{color:var(--dim);font-size:14.5px;margin:0 0 4px}
.np-badges{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 26px}
.np-list-h{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600;

const NEW_DAYS = 7;   /* 신곡 표시 기간 — 일주일 단위로 갱신 */
function isNew(o) {
  if (!o || !o.added) return false;
  const t = Date.parse(o.added + "T00:00:00+09:00");
  if (isNaN(t)) return false;
  return Date.now() - t < NEW_DAYS * 864e5;

/* ---- 재생 집계 ----
   REMOTE : 전 세계 접속자 합산 (공용 카운터 서버)
   local  : 이 기기 백업 (서버가 안 될 때만 사용)          ---- */
const CT = { base: "https://abacus.jasoncameron.dev", ns: "wevape-singer-live" };
const pad2 = (n) => String(n).padStart(2, "0");
/* 접속 국가와 무관하게 한국시간(KST) 기준으로 집계 — 깃허브 액션과 키를 맞추기 위함 */
const kst = (d) => new Date((d ? d.getTime() : Date.now()) + 9 * 36e5);
function isoWeek(k) {
  const t = new Date(Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate()));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3);
  const y = t.getUTCFullYear();
  const jan4 = new Date(Date.UTC(y, 0, 4));
  return y + pad2(1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7));
}
function bucket(range, d) {
  const k = kst(d);
  if (range === "day") return "d" + k.getUTCFullYear() + pad2(k.getUTCMonth() + 1) + pad2(k.getUTCDate());
  if (range === "week") return "w" + isoWeek(k);
  if (range === "month") return "m" + k.getUTCFullYear() + pad2(k.getUTCMonth() + 1);
  return "all";
}
const ckeyAt = (range, trackKey, d) => bucket(range, d) + "-" + String(trackKey).replace(/[^a-zA-Z0-9_-]/g, "-");
const ckey = (range, trackKey) => ckeyAt(range, trackKey, null);
const RANGE_ALL = ["day", "week", "month", "all"];
const REMOTE = {};
let remoteState = "idle";

function cGet(k) {
  return fetch(CT.base + "/get/" + CT.ns + "/" + k, { cache: "no-store" })
    .then(r => (r.status === 404 ? { value: 0 } : r.json()))
    .then(j => (j.value | 0))
    .catch(() => null);
}
function cHit(k) {
  fetch(CT.base + "/hit/" + CT.ns + "/" + k, { cache: "no-store" })
    .then(r => r.json())
    .then(j => { if (typeof j.value === "number") { REMOTE[k] = j.value; refreshChartRows(); } })
    .catch(() => {});
}
function loadCounts(range) {
  remoteState = "loading";
  const rs = range === "all" ? ["all"] : [range, "all"];
  const ks = [];
  rs.forEach(r => PLAYABLE.forEach(t => ks.push(ckey(r, t.key))));
  return Promise.all(ks.map(cGet)).then(vals => {
    let ok = false;
    ks.forEach((k, i) => { if (vals[i] !== null) { REMOTE[k] = Math.max(REMOTE[k] || 0, vals[i]); ok = true; } });
    remoteState = ok ? "ok" : "fail";
    refreshChartRows();
  });
}
let chartTimer = null;
function startChartPoll() {

const BACKFILL_KEY = "wevape-singer-backfilled-v2";
function backfillOnce() {
  try {
    if (localStorage.getItem(BACKFILL_KEY)) return;
    const l = readLog().slice(-300);
    localStorage.setItem(BACKFILL_KEY, String(l.length));
    if (!l.length) return;
    const valid = {};
    PLAYABLE.forEach(t => { valid[t.key] = 1; });
    l.filter(([k]) => valid[k]).forEach(([k, t], i) => {
      const d = new Date(t);
      setTimeout(() => { RANGE_ALL.forEach(r => cHit(ckeyAt(r, k, d))); }, i * 300);
    });
  } catch (e) {}
}

const PLAYLOG_KEY = "wevape-singer-plays";
function readLog() {
  try { const v = JSON.parse(localStorage.getItem(PLAYLOG_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function writeLog(list) {
  try { localStorage.setItem(PLAYLOG_KEY, JSON.stringify(list.slice(-6000))); } catch (e) {}
}
function logPlay(key) {
  const l = readLog(); l.push([key, Date.now()]); writeLog(l);
  RANGE_ALL.forEach(r => {
    const k = ckey(r, key);
    REMOTE[k] = (REMOTE[k] || 0) + 1;   /* 화면에 즉시 반영 */
    cHit(k);                            /* 서버에 누적 */
  });
  refreshChartRows();
}
const RANGE_LABEL = { day: "일간", week: "주간", month: "월간", all: "전체 누적" };
const RANGE_DESC = { day: "오늘 하루", week: "이번 주(월~일)", month: "이번 달", all: "서비스 시작 이후 전체" };
function localCount(range, key) {
  const b = bucket(range); let n = 0;
  readLog().forEach(([k, t]) => { if (k === key && bucket(range, new Date(t)) === b) n++; });
  return n;
}
function countOf(range, key) {
  return Math.max(REMOTE[ckey(range, key)] || 0, localCount(range, key));
}

const DJ = { master: null, padOut: null, decks: {}, cache: {}, slices: [], xf: 0.5, raf: null, loading: {} };

function djInit() {
  ensureAudioGraph();
  if (!ac) return false;
  if (DJ.master) return true;
  DJ.master = ac.createGain(); DJ.master.gain.value = 0.9;
  DJ.master.connect(analyser || ac.destination);
  DJ.padOut = ac.createGain(); DJ.padOut.gain.value = 0.85;
  DJ.padOut.connect(DJ.master);
  ["A","B"].forEach(function (k) {
    const g = ac.createGain(); g.connect(DJ.master);
    DJ.decks[k] = { id: k, gain: g, buffer: null, track: null, src: null,
                    playing: false, startAt: 0, offset: 0, rate: 1, vol: 0.85 };
  });
  applyXfader();
  return true;
}

function loadBuffer(url) {
  if (DJ.cache[url]) return Promise.resolve(DJ.cache[url]);
  return fetch(url).then(function (r) { return r.arrayBuffer(); })
    .then(function (b) { return new Promise(function (res, rej) { ac.decodeAudioData(b, res, rej); }); })
    .then(function (buf) { DJ.cache[url] = buf; return buf; });
}

function deckPos(d) {
  if (!d || !d.buffer) return 0;
  return d.playing ? Math.min(d.buffer.duration, d.offset + (ac.currentTime - d.startAt) * d.rate) : d.offset;
}

function deckStop(id, keep) {
  const d = DJ.decks[id]; if (!d) return;
  if (d.src) {
    const pos = deckPos(d);
    try { d.src.onended = null; d.src.stop(); } catch (e) {}
    d.src = null; d.offset = keep ? pos : 0;
  } else if (!keep) d.offset = 0;
  d.playing = false;
}

function deckPlay(id) {
  const d = DJ.decks[id];
  if (!d || !d.buffer || d.playing) return;
  if (ac.state === "suspended") ac.resume();
  const s = ac.createBufferSource();
  s.buffer = d.buffer; s.playbackRate.value = d.rate;
  s.connect(d.gain);
  s.start(0, Math.max(0, Math.min(d.offset, d.buffer.duration - 0.05)));
  s.onended = function () { if (d.src === s) { d.src = null; d.playing = false; d.offset = 0; renderDeck(id); } };
  d.src = s; d.playing = true; d.startAt = ac.currentTime;
  renderDeck(id);
}

function deckToggle(id) {
  const d = DJ.decks[id]; if (!d || !d.buffer) return;
  if (d.playing) { deckStop(id, true); renderDeck(id); } else deckPlay(id);
}

function deckCue(id) {
  const d = DJ.decks[id]; if (!d) return;
  const was = d.playing;
  deckStop(id, false);
  if (was) deckPlay(id); else renderDeck(id);
}

function deckRate(id, r) {
  const d = DJ.decks[id]; if (!d) return;
  if (d.playing) { d.offset = deckPos(d); d.startAt = ac.currentTime; }
  d.rate = r;
  if (d.src) d.src.playbackRate.value = r;
}

function deckVol(id, v) { const d = DJ.decks[id]; if (d) { d.vol = v; applyXfader(); } }

function deckLoad(id, key) {
  const d = DJ.decks[id]; const t = PLAYABLE.find(function (x) { return x.key === key; });
  if (!d || !t) return;
  deckStop(id, false);
  d.track = t; d.buffer = null;
  DJ.loading[id] = true; renderDeck(id);
  loadBuffer(t.src).then(function (buf) {
    d.buffer = buf; DJ.loading[id] = false;
    if (id === "A") { buildHooks(); renderJog(); }
    renderDeck(id); renderPads();
  }).catch(function () { DJ.loading[id] = false; renderDeck(id); });
}

function applyXfader() {
  const x = DJ.xf;
  const a = Math.cos(x * Math.PI / 2), b = Math.cos((1 - x) * Math.PI / 2);
  if (DJ.decks.A) DJ.decks.A.gain.gain.value = a * DJ.decks.A.vol;
  if (DJ.decks.B) DJ.decks.B.gain.gain.value = b * DJ.decks.B.vol;
  const ea = document.getElementById("xfA"), eb = document.getElementById("xfB");
  if (ea) ea.style.opacity = (0.32 + a * 0.68).toFixed(2);
  if (eb) eb.style.opacity = (0.32 + b * 0.68).toFixed(2);
}

function buildHooks() {
  const buf = DJ.decks.A && DJ.decks.A.buffer;
  DJ.slices = [];
  if (!buf) return;
  const L = buf.duration;
  for (let i = 0; i < 8; i++) DJ.slices.push({ start: L * i / 8, dur: L / 8 });
}

function playHook(i) {
  const d = DJ.decks.A;
  if (!d || !d.buffer || !DJ.slices[i]) return;
  if (ac.state === "suspended") ac.resume();
  const sl = DJ.slices[i], dur = Math.min(sl.dur, 8), t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = d.buffer;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(1, t + 0.012);
  g.gain.setValueAtTime(1, t + Math.max(0.06, dur - 0.09));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(g); g.connect(DJ.padOut);
  s.start(t, sl.start, dur);
  s.stop(t + dur + 0.03);
  flashPad("h" + i);
}

function noiseBuffer(dur) {
  const n = Math.max(1, Math.floor(ac.sampleRate * dur));
  const b = ac.createBuffer(1, n, ac.sampleRate);
  const c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
  return b;
}
function envGain(t, a, dcy, peak) {
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dcy);
  return g;
}
function noiseHit(t, dur, type, freq, q, peak) {
  const s = ac.createBufferSource(); s.buffer = noiseBuffer(dur + 0.06);
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
  const g = envGain(t, 0.002, dur, peak);
  s.connect(f); f.connect(g); g.connect(DJ.padOut);
  s.start(t); s.stop(t + dur + 0.07);
}

function playDrum(id) {
  if (!ac || !DJ.padOut) return;
  if (ac.state === "suspended") ac.resume();
  const t = ac.currentTime;
  if (id === "kick") {
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.13);
    const g = envGain(t, 0.004, 0.34, 1.05);
    o.connect(g); g.connect(DJ.padOut); o.start(t); o.stop(t + 0.42);
    noiseHit(t, 0.03, "lowpass", 2400, 1, 0.35);
  } else if (id === "snare") {
    noiseHit(t, 0.19, "bandpass", 1900, 0.7, 0.75);
    const o = ac.createOscillator(); o.type = "triangle";
    o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.11);
    const g = envGain(t, 0.003, 0.13, 0.5);
    o.connect(g); g.connect(DJ.padOut); o.start(t); o.stop(t + 0.2);
  } else if (id === "hat") {
    noiseHit(t, 0.055, "highpass", 8200, 0.9, 0.42);
  } else if (id === "clap") {
    [0, 0.013, 0.027, 0.043].forEach(function (o, i) {
      noiseHit(t + o, i === 3 ? 0.17 : 0.035, "bandpass", 1250, 1.3, i === 3 ? 0.62 : 0.5);
    });
  } else if (id === "horn") {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.05);
    g.gain.setValueAtTime(0.5, t + 0.95);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.25);
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1400; f.Q.value = 1.1;
    const lfo = ac.createOscillator(); lfo.frequency.value = 6.2;
    const lg = ac.createGain(); lg.gain.value = 9;
    lfo.connect(lg);
    [370, 466, 555].forEach(function (fr, i) {
      const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr;
      lg.connect(o.frequency);
      const og = ac.createGain(); og.gain.value = i === 0 ? 0.5 : 0.28;
      o.connect(og); og.connect(f); o.start(t); o.stop(t + 1.3);
    });
    f.connect(g); g.connect(DJ.padOut);
    lfo.start(t); lfo.stop(t + 1.3);
  } else if (id === "riser") {
    const s = ac.createBufferSource(); s.buffer = noiseBuffer(1.7);
    const f = ac.createBiquadFilter(); f.type = "highpass"; f.Q.value = 6;
    f.frequency.setValueAtTime(240, t);
    f.frequency.exponentialRampToValueAtTime(9000, t + 1.5);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.55, t + 1.42);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.62);
    s.connect(f); f.connect(g); g.connect(DJ.padOut);
    s.start(t); s.stop(t + 1.7);
  } else if (id === "stop") {
    vinylStop();
  } else if (id === "boom") {
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(92, t); o.frequency.exponentialRampToValueAtTime(32, t + 0.9);
    const g = envGain(t, 0.006, 1.05, 0.95);
    o.connect(g); g.connect(DJ.padOut); o.start(t); o.stop(t + 1.2);
    noiseHit(t, 0.6, "lowpass", 900, 0.7, 0.3);
  }
  flashPad("d" + id);
}

function vinylStop() {
  let any = false;
  ["A","B"].forEach(function (k) {
    const d = DJ.decks[k];
    if (!d || !d.playing || !d.src) return;
    any = true;
    const t = ac.currentTime, pos = deckPos(d), pr = d.src.playbackRate;
    pr.cancelScheduledValues(t);
    pr.setValueAtTime(d.rate, t);
    pr.linearRampToValueAtTime(0.02, t + 0.55);
    pr.setValueAtTime(0.02, t + 0.85);
    pr.linearRampToValueAtTime(d.rate, t + 1.25);
    d.offset = pos; d.startAt = t;
    setTimeout(function () {
      if (!d.playing) return;
      d.offset = pos + d.rate * 0.5;
      d.startAt = ac.currentTime;
    }, 1300);
  });
  if (!any) {
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(28, t + 0.75);
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2200;
    const g = envGain(t, 0.01, 0.8, 0.4);
    o.connect(f); f.connect(g); g.connect(DJ.padOut);
    o.start(t); o.stop(t + 0.9);
  }
}

/* ---- 사람 목소리 비슷한 모음(포먼트) 합성 ---- */
const VOWEL = {   /* [F1, F2, F3] 남성 기준 */
  a:  [730, 1090, 2440],   /* 아 */
  eo: [640, 1190, 2390],   /* 어 */
  eu: [300, 1390, 2200],   /* 으 */
  o:  [570,  840, 2410]    /* 오 */
};

function voiceHit(opt) {
  const t = ac.currentTime;
  const dur = opt.dur, F0 = opt.f0, F1 = opt.f1;
  const A = VOWEL[opt.from], B = VOWEL[opt.to || opt.from];

  const out = ac.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(opt.peak || 0.5, t + (opt.atk || 0.07));
  out.gain.setValueAtTime(opt.peak || 0.5, t + dur * 0.72);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  out.connect(DJ.padOut);

  /* 성대: 톱니 + 비브라토 */
  const osc = ac.createOscillator(); osc.type = "sawtooth";
  osc.frequency.setValueAtTime(F0, t);
  if (opt.mid) {
    osc.frequency.exponentialRampToValueAtTime(opt.mid, t + dur * 0.35);
    osc.frequency.exponentialRampToValueAtTime(F1, t + dur);
  } else {
    osc.frequency.exponentialRampToValueAtTime(F1, t + dur);
  }
  const vib = ac.createOscillator(); vib.frequency.value = opt.vib || 5.4;
  const vibG = ac.createGain(); vibG.gain.value = opt.vibDepth || 5;
  vib.connect(vibG); vibG.connect(osc.frequency);

  /* 숨소리 */
  const br = ac.createBufferSource(); br.buffer = noiseBuffer(dur + 0.1);
  const brF = ac.createBiquadFilter(); brF.type = "bandpass"; brF.frequency.value = 1800; brF.Q.value = 0.8;
  const brG = ac.createGain(); brG.gain.value = 0.055;
  br.connect(brF); brF.connect(brG);

  /* 포먼트 3개 */
  [0, 1, 2].forEach(function (i) {
    const f = ac.createBiquadFilter(); f.type = "bandpass";
    f.frequency.setValueAtTime(A[i], t);
    f.frequency.linearRampToValueAtTime(B[i], t + dur * 0.85);
    f.Q.value = [9, 11, 13][i];
    const g = ac.createGain(); g.gain.value = [1, 0.62, 0.3][i];
    osc.connect(f); brG.connect(f); f.connect(g); g.connect(out);
  });

  osc.start(t); osc.stop(t + dur + 0.05);
  vib.start(t); vib.stop(t + dur + 0.05);
  br.start(t);  br.stop(t + dur + 0.05);
}

/* ---- 함성·박수 버퍼 (한 번 만들어 재사용) ---- */
let CROWD = null;
function crowdBuffer() {
  if (CROWD) return CROWD;
  const sec = 2.8, n = Math.floor(ac.sampleRate * sec);
  const b = ac.createBuffer(1, n, ac.sampleRate);
  const c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * 0.12;   /* 웅성거림 */
  for (let k = 0; k < 260; k++) {                                      /* 박수 알갱이 */
    const at = Math.floor(Math.random() * (n - 2000));
    const len = 120 + Math.floor(Math.random() * 260);
    const amp = 0.35 + Math.random() * 0.5;
    for (let i = 0; i < len; i++) {
      const e = Math.pow(1 - i / len, 2.4);
      c[at + i] += (Math.random() * 2 - 1) * amp * e;
    }
  }
  let peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(c[i]));
  for (let i = 0; i < n; i++) c[i] /= peak * 1.05;
  CROWD = b; return b;
}

/* ---- 곡 원샷 패드: 누르면 그 곡이 통째로 나가고, 다시 누르면 정지 ---- */
const SONGP = { key: null, node: null, gain: null, loading: null };

function stopSong() {
  if (SONGP.node) { try { SONGP.node.onended = null; SONGP.node.stop(); } catch (e) {} SONGP.node = null; }
  if (SONGP.gain) { try { SONGP.gain.disconnect(); } catch (e) {} SONGP.gain = null; }
  const prev = SONGP.key; SONGP.key = null;
  if (prev) markSongPad(prev, false);
}

function markSongPad(key, on) {
  const i = PLAYABLE.findIndex(function (x) { return x.key === key; });
  const el = document.querySelector('.pad[data-pad="s' + i + '"]');
  if (el) el.classList.toggle("busy", !!on);
}

function playSong(key) {
  const t = PLAYABLE.find(function (x) { return x.key === key; });
  if (!t || !ac) return;
  if (ac.state === "suspended") ac.resume();
  if (SONGP.key === key) { stopSong(); return; }
  stopSong();
  SONGP.key = key; markSongPad(key, true);
  SONGP.loading = key;
  loadBuffer(t.src).then(function (buf) {
    if (SONGP.key !== key) return;
    const g = ac.createGain(); g.gain.value = 0.9; g.connect(DJ.master);
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(g);
    s.onended = function () { if (SONGP.node === s) stopSong(); };
    s.start(0);
    SONGP.node = s; SONGP.gain = g;
  }).catch(function () { stopSong(); });
}

/* ---- 나이트 패드 ---- */
function playNight(id) {
  if (!ac || !DJ.padOut) return;
  if (ac.state === "suspended") ac.resume();
  const t = ac.currentTime;
  if (id === "ah") {                    /* 아으~ */
    voiceHit({ dur: 0.85, f0: 168, mid: 132, f1: 104, from: "a", to: "eu", peak: 0.55, vib: 5.2, vibDepth: 6 });
  } else if (id === "eoeo") {           /* 어어어~ */
    voiceHit({ dur: 1.7, f0: 128, mid: 152, f1: 118, from: "eo", to: "eo", peak: 0.5, atk: 0.12, vib: 5.8, vibDepth: 9 });
  } else if (id === "yaho") {           /* 으아~ 환성 */
    voiceHit({ dur: 1.05, f0: 150, mid: 232, f1: 176, from: "eu", to: "a", peak: 0.55, atk: 0.05, vib: 6.4, vibDepth: 8 });
  } else if (id === "ja") {                /* 자~~~ (장현진 시작 신호) */
    noiseHit(t, 0.05, "bandpass", 3100, 1.6, 0.3);          /* ㅈ 파찰음 */
    voiceHit({ dur: 1.95, f0: 124, mid: 190, f1: 170, from: "a", to: "a",
               peak: 0.58, atk: 0.06, vib: 5.6, vibDepth: 12 });
  } else if (id === "siren") {          /* 나이트 사이렌 */
    const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = 720;
    const lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 1.5;
    const lg = ac.createGain(); lg.gain.value = 340;
    lfo.connect(lg); lg.connect(o.frequency);
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1300; f.Q.value = 2.4;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t + 0.1);
    g.gain.setValueAtTime(0.4, t + 2.0);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.45);
    o.connect(f); f.connect(g); g.connect(DJ.padOut);
    o.start(t); o.stop(t + 2.5); lfo.start(t); lfo.stop(t + 2.5);
  } else if (id === "laser") {          /* 뿅뿅 */
    [0, 0.14, 0.28].forEach(function (off) {
      const st = t + off;
      const o = ac.createOscillator(); o.type = "square";
      o.frequency.setValueAtTime(2600, st);
      o.frequency.exponentialRampToValueAtTime(240, st + 0.12);
      const g = envGain(st, 0.003, 0.11, 0.3);
      o.connect(g); g.connect(DJ.padOut);
      o.start(st); o.stop(st + 0.16);
    });
  } else if (id === "scratch") {        /* 스크래치 */
    const d = DJ.decks.A;
    if (d && d.buffer) {
      const at = Math.min(d.buffer.duration - 1.2, Math.max(0, deckPos(d)));
      const s = ac.createBufferSource(); s.buffer = d.buffer;
      const pr = s.playbackRate;
      pr.setValueAtTime(1.6, t);
      pr.linearRampToValueAtTime(0.35, t + 0.12);
      pr.linearRampToValueAtTime(1.9, t + 0.24);
      pr.linearRampToValueAtTime(0.4, t + 0.36);
      pr.linearRampToValueAtTime(1.5, t + 0.48);
      const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1500; f.Q.value = 1.1;
      const g = envGain(t, 0.006, 0.56, 0.75);
      s.connect(f); f.connect(g); g.connect(DJ.padOut);
      s.start(t, at, 0.7); s.stop(t + 0.62);
    } else {
      const s = ac.createBufferSource(); s.buffer = noiseBuffer(0.6);
      const pr = s.playbackRate;
      pr.setValueAtTime(1.8, t); pr.linearRampToValueAtTime(0.3, t + 0.14);
      pr.linearRampToValueAtTime(1.7, t + 0.3); pr.linearRampToValueAtTime(0.4, t + 0.45);
      const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1400; f.Q.value = 3;
      const g = envGain(t, 0.006, 0.5, 0.5);
      s.connect(f); f.connect(g); g.connect(DJ.padOut);
      s.start(t); s.stop(t + 0.6);
    }
  } else if (id === "crowd") {          /* 함성·박수 */
    const s = ac.createBufferSource(); s.buffer = crowdBuffer();
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1500; f.Q.value = 0.55;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.62, t + 0.28);
    g.gain.setValueAtTime(0.62, t + 1.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.75);
    s.connect(f); f.connect(g); g.connect(DJ.padOut);
    s.start(t); s.stop(t + 2.8);
  }
  flashPad("n" + id);
}

/* ═══════ 조그휠 스크래치 (레코드 잡고 왔다갔다) ═══════ */
const SCR = {
  on: false, deck: "A", node: null, gain: null, dir: 1, pos: 0,
  win: null, winBuf: null, wasPlaying: false, lastAng: 0, lastT: 0,
  vel: 0, angle: 0, spin: 0, raf: null
};
const SEC_PER_TURN = 1.8;      /* 한 바퀴 = 1.8초 (33⅓ rpm) */

/* 뒤로 긁을 때 쓸 역재생 구간 (12초 창) — 통째로 뒤집으면 메모리가 커서 창만 만듭니다 */
function buildRevWindow(buf, center) {
  const sr = buf.sampleRate, W = 12;
  const w0 = Math.max(0, Math.min(Math.max(0, buf.duration - W), center - W / 2));
  const start = Math.floor(w0 * sr);
  const len = Math.min(Math.floor(W * sr), buf.length - start);
  if (len <= 0) return null;
  const r = ac.createBuffer(buf.numberOfChannels, len, sr);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const sdat = buf.getChannelData(c), ddat = r.getChannelData(c);
    for (let i = 0; i < len; i++) ddat[i] = sdat[start + len - 1 - i];
  }
  return { w0: w0, W: len / sr, buf: r };
}

function scrStopNode() {
  if (SCR.node) {
    try { SCR.node.onended = null; SCR.node.stop(); } catch (e) {}
    SCR.node = null;
  }
}

function scrStartNode(dir, rate) {
  const d = DJ.decks[SCR.deck];
  if (!d || !d.buffer) return;
  scrStopNode();
  const t = ac.currentTime;
  const s = ac.createBufferSource();
  let off;
  if (dir >= 0) { s.buffer = d.buffer; off = Math.max(0, Math.min(d.buffer.duration - 0.05, SCR.pos)); }
  else {
    if (!SCR.win) return;
    s.buffer = SCR.win.buf;
    off = (SCR.win.w0 + SCR.win.W) - SCR.pos;
    if (off < 0.02 || off > SCR.win.W - 0.02) return;
  }
  s.playbackRate.value = Math.max(0.02, Math.min(4, rate));
  s.connect(SCR.gain);
  s.start(t, off);
  SCR.node = s; SCR.dir = dir;
}

function scratchStart(ev) {
  const d = DJ.decks[SCR.deck];
  if (!d || !d.buffer) return;
  if (ac.state === "suspended") ac.resume();
  SCR.on = true;
  SCR.wasPlaying = d.playing;
  SCR.pos = deckPos(d);
  deckStop(SCR.deck, true);
  renderDeck(SCR.deck);
  SCR.win = buildRevWindow(d.buffer, SCR.pos);
  SCR.gain = ac.createGain(); SCR.gain.gain.value = 0.95;
  SCR.gain.connect(DJ.master);
  SCR.lastAng = jogAngle(ev);
  SCR.lastT = performance.now();
  SCR.vel = 0;
  scrStartNode(1, 0.02);
  const el = document.getElementById("jog");
  if (el) el.classList.add("grab");
}

function scratchMove(ev) {
  if (!SCR.on) return;
  const d = DJ.decks[SCR.deck];
  if (!d || !d.buffer) return;
  const a = jogAngle(ev), now = performance.now();
  let da = a - SCR.lastAng;
  while (da > Math.PI) da -= Math.PI * 2;
  while (da < -Math.PI) da += Math.PI * 2;
  const dt = Math.max(0.008, (now - SCR.lastT) / 1000);
  SCR.lastAng = a; SCR.lastT = now;
  SCR.angle += da * 180 / Math.PI;

  const dsec = (da / (Math.PI * 2)) * SEC_PER_TURN;
  SCR.pos = Math.max(0, Math.min(d.buffer.duration - 0.05, SCR.pos + dsec));
  const v = dsec / dt;
  SCR.vel = SCR.vel * 0.45 + v * 0.55;

  /* 역방향 창을 벗어나면 다시 만듦 */
  if (SCR.win && (SCR.pos < SCR.win.w0 + 1 || SCR.pos > SCR.win.w0 + SCR.win.W - 1)) {
    SCR.win = buildRevWindow(d.buffer, SCR.pos);
    if (SCR.dir < 0) scrStartNode(-1, Math.abs(SCR.vel));
  }
  const nd = SCR.vel >= 0 ? 1 : -1;
  const rate = Math.max(0.02, Math.min(4, Math.abs(SCR.vel)));
  if (nd !== SCR.dir || !SCR.node) scrStartNode(nd, rate);
  else if (SCR.node) {
    try { SCR.node.playbackRate.setTargetAtTime(rate, ac.currentTime, 0.006); } catch (e) { SCR.node.playbackRate.value = rate; }
  }
  const jd = document.getElementById("jogDisc");
  if (jd) jd.style.transform = "rotate(" + SCR.angle.toFixed(1) + "deg)";
  const sp = document.getElementById("jogSpeed");
  if (sp) sp.textContent = (SCR.vel >= 0 ? "▶ " : "◀ ") + Math.abs(SCR.vel).toFixed(2) + "×";
}

function scratchEnd() {
  if (!SCR.on) return;
  SCR.on = false;
  const d = DJ.decks[SCR.deck];
  scrStopNode();
  if (SCR.gain) {
    const g = SCR.gain, t = ac.currentTime;
    try { g.gain.setTargetAtTime(0.0001, t, 0.02); } catch (e) {}
    setTimeout(function () { try { g.disconnect(); } catch (e) {} }, 200);
    SCR.gain = null;
  }
  if (d) {
    d.offset = SCR.pos;
    if (SCR.wasPlaying) deckPlay(SCR.deck); else renderDeck(SCR.deck);
  }
  const el = document.getElementById("jog");
  if (el) el.classList.remove("grab");
  const sp = document.getElementById("jogSpeed");
  if (sp) sp.textContent = "";
}

function jogAngle(ev) {
  const el = document.getElementById("jog");
  if (!el) return 0;
  const r = el.getBoundingClientRect();
  const x = (ev.clientX !== undefined ? ev.clientX : 0) - (r.left + r.width / 2);
  const y = (ev.clientY !== undefined ? ev.clientY : 0) - (r.top + r.height / 2);
  return Math.atan2(y, x);
}

function jogSpin() {
  if (SCR.raf) cancelAnimationFrame(SCR.raf);
  const step = function () {
    if (currentView !== "dj") { SCR.raf = null; return; }
    const d = DJ.decks[SCR.deck];
    if (!SCR.on && d && d.playing) {
      SCR.angle += 360 / (SEC_PER_TURN * 60) * d.rate;
      const jd = document.getElementById("jogDisc");
      if (jd) jd.style.transform = "rotate(" + SCR.angle.toFixed(1) + "deg)";
    }
    SCR.raf = requestAnimationFrame(step);
  };
  SCR.raf = requestAnimationFrame(step);
}

  const hi = HOOK_KEYS.indexOf(e.key);
  if (hi >= 0) { e.preventDefault(); playHook(hi); return; }

  if (dr) { e.preventDefault(); playDrum(dr.id); return; }

/* 가사: 줄 앞에 [분:초] 를 붙이면 재생에 맞춰 자동으로 따라갑니다 */
let LYRICS = [];
function lyricsHtml(t) {
  LYRICS = [];
  const raw = (t.lyrics || "").trim();
  if (!raw) {
    return `<div class="lyr-empty">이 곡은 아직 가사가 등록되지 않았습니다.<br>
      가사가 준비되면 이 자리에 바로 올라갑니다.</div>`;
  }
  const lines = raw.split("\n");
  let timed = false, out = "";
  lines.forEach((ln) => {
    const m = ln.match(/^\s*\[(\d+):(\d{1,2})(?:\.(\d+))?\]\s*(.*)$/);
    if (m) {
      timed = true;
      const sec = (+m[1]) * 60 + (+m[2]) + (m[3] ? +("0." + m[3]) : 0);
      const txt = m[4];
      LYRICS.push(sec);
      out += `<p data-t="${sec}" data-i="${LYRICS.length - 1}">${esc(txt || "·")}</p>`;
    } else if (!ln.trim()) {
      out += `<p class="blank"></p>`;
    } else if (/^\s*\[.+\]\s*$/.test(ln)) {
      out += `<p class="sec">${esc(ln.trim().replace(/^\[|\]$/g, ""))}</p>`;
    } else {
      out += `<p>${esc(ln)}</p>`;
    }
  });
  return `<div class="lyr${timed ? " timed" : ""}" id="lyr">${out}</div>`;
}

function syncLyrics() {
  if (!LYRICS.length) return;
  const box = document.getElementById("lyr");
  if (!box || box.offsetParent === null) return;
  let idx = -1;
  for (let i = 0; i < LYRICS.length; i++) if (au.currentTime >= LYRICS[i] - 0.15) idx = i;
  const el = idx >= 0 ? box.querySelector('[data-i="' + idx + '"]') : null;
  if (el && !el.classList.contains("on")) {
    box.querySelectorAll("p.on").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    const top = el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2;
    box.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  }
}

}

/* =================== 플레이어 =================== */
let cur = null, shuffle = false, repeat = false, seeking = false;
let ac = null, analyser = null, srcNode = null, freq = null;

function ensureAudioGraph() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    ac = new AC();
    srcNode = ac.createMediaElementSource(au);
    analyser = ac.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.75;
    freq = new Uint8Array(analyser.frequencyBinCount);
    srcNode.connect(analyser); analyser.connect(ac.destination);
  } catch (err) { ac = null; analyser = null; }
}

function play(track) {
  if (!track) return;
  ensureAudioGraph();
  const sameTrack = cur && cur.key === track.key;
  if (!track.src) return;
  if (!sameTrack) {
    cur = track;
    logPlay(track.key);
    au.src = track.src;
    au.load();
    const a = track.artist;
    $("#npTitle").textContent = track.title;
    $("#npArtist").textContent = a.name + " · " + a.tag;
    const rec = $("#record");
    rec.style.setProperty("--label-a", a.color);
    const art = $("#recordArt");
    const cv = track.album && track.album.cover;
    if (cv) { art.src = cv; art.hidden = false; } else { art.hidden = true; art.removeAttribute("src"); }
    $("#durTime").textContent = track.duration ? fmt(track.duration) : "0:00";
  }
  const wasPlaying = !au.paused;
  au.play().catch(() => {});
  if (!wasPlaying || !sameTrack) setTimeout(() => needleDrop(au.currentTime / (au.duration || 1)), 60);
  renderPlayer(track);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggle() {
  if (!cur) return play(PLAYABLE[0]);
  ensureAudioGraph();
  if (au.paused) { au.play().catch(() => {}); setTimeout(() => needleDrop(au.currentTime / (au.duration || 1)), 60); }
  else au.pause();
}

function step(dir) {
  if (!cur) return play(PLAYABLE[0]);
  if (!PLAYABLE.length) return;
  const i = PLAYABLE.findIndex(t => t.key === cur.key);
  if (shuffle && PLAYABLE.length > 1) {
    let n; do { n = Math.floor(Math.random() * PLAYABLE.length); } while (n === i);
    return play(PLAYABLE[n]);
  }
  play(PLAYABLE[(i + dir + PLAYABLE.length) % PLAYABLE.length]);
}

function refreshRows() {
  document.querySelectorAll(".track").forEach(el => {
    if (cur && el.dataset.key === cur.key) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
}

const ARM_SPECS = [
  { sel: "#tonearm", rest: -62, lift: -70, outer: 26, inner: 8 },
  { sel: "#armBig",  rest: 115, lift: 122, outer: 98, inner: 80 }
];
function armEls() { return ARM_SPECS.map(k => ({ el: document.querySelector(k.sel), k })).filter(x => x.el); }
function setArm(p) {
  armEls().forEach(({ el, k }) => {
    const deg = (p === null ? k.rest : (k.outer + p * (k.inner - k.outer)));
    el.style.transform = "rotate(" + deg + "deg)";
  });
}

/* 바늘 올렸다 → 판 위로 탁 내려놓기 */
function needleDrop(p) {
  const platter = document.querySelector(".platter");
  armEls().forEach(({ el, k }) => { el.classList.remove("drop"); el.classList.add("lift"); el.style.transform = "rotate(" + k.lift + "deg)"; });
  setTimeout(() => {
    armEls().forEach(({ el }) => { el.classList.remove("lift"); el.classList.add("drop"); });
    setArm(p || 0);
    if (platter) { platter.classList.remove("thud"); void platter.offsetWidth; platter.classList.add("thud"); }
    crackle();
  }, 170);
  setTimeout(() => armEls().forEach(({ el }) => el.classList.remove("drop")), 900);
}

/* 바늘 닿는 "탁 · 찌직" 소리 */
function crackle() {
  if (!ac) return;
  try {
    const dur = 0.22, n = Math.floor(ac.sampleRate * dur);
    const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) {
      const t = i / ac.sampleRate;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t / dur, 3) * (t < 0.012 ? 1 : 0.28);
    }
    const src = ac.createBufferSource(); src.buffer = b;
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2100; f.Q.value = 0.7;
    const g = ac.createGain(); g.gain.value = 0.5;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  } catch (e) {}
}
function paint(p) {
  p = Math.max(0, Math.min(1, p || 0));
  $("#seekFill").style.width = (p * 100) + "%";
  $("#seekKnob").style.left = (p * 100) + "%";
  $("#seek").setAttribute("aria-valuenow", Math.round(p * 100));
  $("#curTime").textContent = fmt(au.currentTime);
  if (!au.paused) setArm(p);
}

/* 진행바 드래그 */
const seek = $("#seek");
const ratioFrom = (e) => { const r = seek.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
seek.addEventListener("pointerdown", (e) => { if (!cur) return; seeking = true; seek.setPointerCapture(e.pointerId); const p = ratioFrom(e); paint(p); setArm(p); });
seek.addEventListener("pointermove", (e) => { if (!seeking) return; const p = ratioFrom(e); paint(p); setArm(p); });
seek.addEventListener("pointerup", (e) => { if (!seeking) return; seeking = false; if (isFinite(au.duration)) au.currentTime = ratioFrom(e) * au.duration; });
seek.addEventListener("keydown", (e) => {
  if (!cur || !isFinite(au.duration)) return;
  if (e.key === "ArrowRight") { au.currentTime = Math.min(au.duration, au.currentTime + 5); e.preventDefault(); }
  if (e.key === "ArrowLeft") { au.currentTime = Math.max(0, au.currentTime - 5); e.preventDefault(); }
});

/* 볼륨 */
const volBar = $("#volBar");
au.volume = 0.8;
const setVol = (e) => { const r = volBar.getBoundingClientRect(); const v = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); au.volume = v; $("#volFill").style.width = (v * 100) + "%"; volBar.setAttribute("aria-valuenow", Math.round(v * 100)); };
let volDrag = false;
volBar.addEventListener("pointerdown", (e) => { volDrag = true; volBar.setPointerCapture(e.pointerId); setVol(e); });
volBar.addEventListener("pointermove", (e) => { if (volDrag) setVol(e); });
volBar.addEventListener("pointerup", () => { volDrag = false; });
volBar.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    au.volume = Math.max(0, Math.min(1, au.volume + (e.key === "ArrowRight" ? .05 : -.05)));
    $("#volFill").style.width = (au.volume * 100) + "%"; volBar.setAttribute("aria-valuenow", Math.round(au.volume * 100)); e.preventDefault();
  }
});

/* 턴테이블 회전 + 레벨 미터 — 한 루프에서 처리 */
const vu = $("#vu"), vctx = vu.getContext("2d");
const recordEl = $("#record");
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const RPM_DEG = 200;              // 33 1/3 rpm 느낌 (초당 회전 각도)
let angle = 0, vel = 0, last = 0, looping = false;

function startLoop() { if (!looping) { looping = true; last = performance.now(); requestAnimationFrame(loop); } }

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const target = au.paused ? 0 : RPM_DEG;

  // 턴테이블: 목표 속도까지 서서히 붙었다가, 멈출 땐 관성으로 천천히 정지
  vel += (target - vel) * Math.min(1, dt * (au.paused ? 1.6 : 5.5));
  angle = (angle + vel * dt) % 360;
  if (!REDUCED) {
    const rot = "rotate(" + angle.toFixed(2) + "deg)";
    recordEl.style.transform = rot;
    const big = document.getElementById("lp");
    if (big) big.style.transform = rot;
  }

  // 레벨 미터
  vctx.clearRect(0, 0, vu.width, vu.height);
  const css = getComputedStyle(document.documentElement);
  const brass = css.getPropertyValue("--brass").trim() || "#D6A340";
  const line = css.getPropertyValue("--line").trim() || "#333";
  const bars = 22, gap = 2, w = (vu.width - gap * (bars - 1)) / bars;
  if (analyser) analyser.getByteFrequencyData(freq);
  const damp = au.paused ? Math.max(0, vel / RPM_DEG) : 1;
  for (let k = 0; k < bars; k++) {
    const raw = analyser ? freq[Math.floor(k * freq.length / bars / 1.6)] / 255 : 0.3;
    const h = Math.max(2, Math.pow(raw, 1.25) * vu.height * damp);
    vctx.fillStyle = line; vctx.fillRect(k * (w + gap), 0, w, vu.height);
    vctx.fillStyle = brass; vctx.fillRect(k * (w + gap), vu.height - h, w, h);
  }

  if (!au.paused || vel > 0.5) requestAnimationFrame(loop);
  else { looping = false; vctx.clearRect(0, 0, vu.width, vu.height); }
}

/* 키보드 */
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.code === "ArrowRight" && e.shiftKey) step(1);
  if (e.code === "ArrowLeft" && e.shiftKey) step(-1);
});

/* 테마 */
$("#themeBtn").addEventListener("click", () => {
  const curTheme = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = curTheme ? curTheme === "dark" : sysDark;
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
});

/* ---- 앱 설치 (PWA) ---- */
let deferredPrompt = null;
const installBtn = $("#installBtn"), installTip = $("#installTip");
const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e;
  if (!standalone) installBtn.classList.add("show");
});
window.addEventListener("appinstalled", () => { installBtn.classList.remove("show"); deferredPrompt = null; });
if (!standalone) installBtn.classList.add("show");

installBtn.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice.catch(() => null);
    if (r && r.outcome === "accepted") installBtn.classList.remove("show");
    deferredPrompt = null;
    return;
  }
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua);
  const android = /Android/.test(ua);
  $("#installHow").innerHTML = ios
    ? '사파리 아래쪽 <b>공유 버튼</b>(↑) → <b>홈 화면에 추가</b> 를 누르면 앱처럼 설치됩니다.'
    : android
      ? '브라우저 우측 상단 <b>⋮ 메뉴</b> → <b>앱 설치</b>(또는 홈 화면에 추가) 를 누르면 됩니다.'
      : '크롬 주소창 오른쪽 끝의 <b>설치 아이콘</b>(⤓) 을 누르거나, <b>⋮ 메뉴 → 캐스트·저장 및 공유 → 페이지를 앱으로 설치</b> 를 선택하세요.';
  installTip.classList.add("show");
});
$("#installTipClose").addEventListener("click", () => installTip.classList.remove("show"));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

setArm(null);
renderHome();
loadPlaysFile();
loadCounts("all");
setInterval(() => loadCounts("all"), 60000);   /* 1분마다 전 서버 누적 갱신 */
setTimeout(backfillOnce, 1500);   /* 예전 기록 서버로 복구 */
</script>
