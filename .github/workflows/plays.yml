name: 재생수 집계

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tracks.json
      - collect.mjs

permissions:
  contents: write

concurrency:
  group: plays-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 카운터에서 재생수 수집
        run: node collect.mjs
      - name: plays.json 커밋
        run: |
          git config user.name "wevape-singer-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plays.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "재생수 집계 갱신"
            git push
          fi
